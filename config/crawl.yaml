# ============================================================
# AlphaFoundry 数据抓取时间配置
# ============================================================
# 修改此文件后重启 API 服务器即可生效，无需改代码。
#
# 时间格式: "HH:MM" (24小时制，北京时间 Asia/Shanghai)
# 设为 null 表示使用标准交易时段（盘前 09:30，收盘 15:00）
# ============================================================

# 盘前提前开始抓取时间（允许在开盘前从此时刻开始抓取）
# null = 不在盘前抓取，等到 09:30 开盘
extended_start_time: "08:30"

# 收盘后延长抓取截止时间（允许在收盘后继续抓取到此时刻）
# null = 15:00 收盘后立即停止
extended_end_time: "17:30"
