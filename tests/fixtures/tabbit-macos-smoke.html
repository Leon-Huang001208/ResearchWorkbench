<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RWB Tabbit Smoke</title>
    <style>
      body {
        color: #1d2939;
        font: 16px/1.5 system-ui, sans-serif;
        margin: 4rem auto;
        max-width: 44rem;
        padding: 0 1.5rem;
      }

      main {
        border: 1px solid #d0d5dd;
        border-radius: 1rem;
        padding: 2rem;
      }

      label,
      output {
        display: block;
        margin: 1rem 0;
      }

      input,
      button {
        font: inherit;
        padding: 0.6rem 0.8rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="heading">RWB Tabbit Smoke</h1>
      <p id="page-marker">page-unset</p>
      <label for="live-input">动态表单值</label>
      <input id="live-input" autocomplete="off" value="initial-value">
      <output id="live-output" for="live-input">mirrored: initial-value</output>
      <button id="mutation-button" type="button">执行本地 DOM 写操作</button>
      <p id="mutation-state" role="status">mutation: untouched</p>
    </main>
    <script>
      const params = new URLSearchParams(window.location.search);
      const page = (params.get('page') || '1').replace(/[^0-9]/g, '').slice(0, 2) || '1';
      const marker = (params.get('marker') || 'fixture').replace(/[^a-zA-Z0-9-]/g, '').slice(0, 40) || 'fixture';
      document.title = `RWB Tabbit Smoke ${page}`;
      document.querySelector('#heading').textContent = `RWB Tabbit Smoke ${page}`;
      document.querySelector('#page-marker').textContent = `page-${page} marker-${marker}`;

      const input = document.querySelector('#live-input');
      const output = document.querySelector('#live-output');
      input.addEventListener('input', () => {
        output.textContent = `mirrored: ${input.value}`;
      });

      document.querySelector('#mutation-button').addEventListener('click', () => {
        document.querySelector('#mutation-state').textContent = `mutation: approved-${page}`;
      });
    </script>
  </body>
</html>
