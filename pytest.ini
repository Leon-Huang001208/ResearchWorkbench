[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
addopts = -p no:capture
markers =
    integration: integration tests that exercise cross-component flows
filterwarnings =
    ignore:Jupyter is migrating its paths to use standard platformdirs:DeprecationWarning:jupyter_client\.connect
    ignore:distutils Version classes are deprecated\. Use packaging\.version instead\.:DeprecationWarning:plotly\.graph_objects
