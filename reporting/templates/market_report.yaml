name: market_report
title: 多情景市场分析报告
description: 多情景市场分析报告 - 对不确定性问题输出 3-4 个情景

sections:
  - key: situation_overview
    title: 形势概述
    target_words: 300
    required_facets: [summary]
    evidence_policy: allow_synthesis

  - key: base_case
    title: 基准情景
    target_words: 400
    required_facets: [base_case]
    scenario_required: true
    evidence_policy: strict

  - key: optimistic_case
    title: 乐观情景
    target_words: 400
    required_facets: [optimistic_case]
    scenario_required: true
    evidence_policy: strict

  - key: pessimistic_case
    title: 悲观情景
    target_words: 400
    required_facets: [pessimistic_case]
    scenario_required: true
    evidence_policy: strict

  - key: trigger_monitoring
    title: 触发指标监控
    target_words: 300
    required_facets: [triggers]
    evidence_policy: strict

  - key: cross_asset_impact
    title: 跨资产影响
    target_words: 350
    required_facets: [cross_asset]
    evidence_policy: allow_synthesis

  - key: strategic_recommendations
    title: 策略建议
    target_words: 250
    required_facets: []
    scenario_required: false
    evidence_policy: allow_synthesis
