name: api_test_template
description: API test template
version: '1.0'
default_retrieval_profile: weekly_report
sections:
- key: market_summary
  title: 市场概览
  target_words: 300
  required_facets:
  - 大盘走势
  - 主要指数表现
  - 成交量
  scenario_required: true
  evidence_policy: strict
  retrieval_profile: weekly_report
  placeholder: market_summary_placeholder
- key: key_events
  title: 本周重要事件
  target_words: 400
  required_facets:
  - 政策新闻
  - 公司公告
  - 行业动态
  scenario_required: true
  evidence_policy: strict
  retrieval_profile: weekly_report
  placeholder: key_events_placeholder
- key: industry_performance
  title: 行业表现分析
  target_words: 350
  required_facets:
  - 涨幅居前行业
  - 跌幅居前行业
  - 行业资金流向
  scenario_required: true
  evidence_policy: strict
  retrieval_profile: weekly_report
  placeholder: industry_performance_placeholder
- key: notable_stocks
  title: 重点股票观察
  target_words: 300
  required_facets:
  - 涨幅榜
  - 跌幅榜
  - 异动股票
  scenario_required: true
  evidence_policy: strict
  retrieval_profile: weekly_report
  placeholder: notable_stocks_placeholder
- key: outlook
  title: 后市展望
  target_words: 250
  required_facets:
  - 技术面
  - 消息面
  - 风险提示
  scenario_required: true
  evidence_policy: allow_synthesis
  retrieval_profile: weekly_report
  placeholder: outlook_placeholder
