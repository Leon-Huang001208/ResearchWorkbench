[package]
name = "research-workbench-desktop"
version = "0.1.0"
description = "Research Workbench desktop shell"
authors = ["Research Workbench Team"]
license = "UNLICENSED"
repository = "https://github.com/Leon-Huang001208/ResearchWorkbench"
edition = "2021"
rust-version = "1.85.0"

[lib]
name = "research_workbench_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.0", features = [] }

[dependencies]
log = "0.4"
tauri = { version = "2.8.2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
