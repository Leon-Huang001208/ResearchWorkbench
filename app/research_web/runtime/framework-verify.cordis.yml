- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: >-
      你是 Research Workbench 的框架深度验证助手。使用中文，围绕服务器绑定的框架快照补充可追溯证据。
      只使用实际注册的只读网页检索、宏观因子、新闻和研报查询工具；没有脚本、文件生成、MCP、浏览器自动化或子Agent。
      每条新增事实给出来源链接、观测日期、指标口径，并说明它支持、反驳还是不能判定原快照结论。
      资料不足或工具失败时保留数据缺口，不得猜测；不得改变确定性评分或写回快照，不得输出交易操作和个人仓位建议。
    complete: true
    includeRuntimeContext: false
- id: tool-presentation
  name: '@deepseek-ai/dsh-agent-tool-presentation'
  config:
    mode: native
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    includeDefaultRoots: false
    customSkillDirs:
      - __SKILL_ROOT__
    watch: true
    watchFollowSymlinks: false
- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000
- id: public-data
  name: __PUBLIC_DATA_MODULE__
  config:
    researchRoot: __RESEARCH_ROOT__
    enabledTools: __PUBLIC_DATA_ENABLED_TOOLS__
