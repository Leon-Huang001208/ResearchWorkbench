<style>
/* React 的挂载点不能占一层盒子：body 直接就是 grid 容器，中间多一个 <div id="root">
   会掐断 height:100% 的参照链，撑满视口的两栏会变成按内容无限长高。 */
#root{display:contents}
</style>
<script>
/* 必须同步跑在 <body> 之前：等 React 挂载再定主题，用户会先看到一帧另一套配色。
   三态：'light' / 'dark' / 'system'（缺省按系统）。 */
try{
  var m = localStorage.getItem('pv-theme-mode')
  var sys = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
  document.documentElement.dataset.theme =
    (m === 'light' || m === 'dark') ? m : sys
}catch(e){ document.documentElement.dataset.theme = 'dark' }
</script>
