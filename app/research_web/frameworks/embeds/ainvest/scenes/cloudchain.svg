  <path class="ph-dash" d="M955 372 C960 470 200 486 130 320"/>
  <polygon points="127,326 126,312 138,318" fill="var(--txt3)"/>
  <text class="ph-lbls" x="540" y="472" text-anchor="middle">订阅 / API / 广告收入回流 → 反哺 Capex · 检验飞轮能否闭环的关键在「模型收入增速 vs 算力折旧」</text>

