  <g class="ph-hot" data-part="powder-formula"><rect class="ph-fill ph-ln" x="525" y="174" width="190" height="138" rx="5"/><path class="ph-ln2" d="M560 230h120m-120 22h120m-120 22h120"/><circle class="ph-chipf" cx="580" cy="208" r="6"/><circle class="ph-gold" cx="620" cy="208" r="6"/><circle class="ph-metal" cx="660" cy="208" r="6"/><text class="ph-lbl" x="620" y="348" text-anchor="middle">配方 / 粒径控制</text><text class="ph-lbls" x="620" y="364" text-anchor="middle">纳米化 · 均一性 · 掺杂</text></g>
