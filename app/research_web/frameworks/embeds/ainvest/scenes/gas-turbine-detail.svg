<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" class="ph-scene">
  <text class="ph-lbls" x="45" y="42">燃气轮机：简单循环直接发电；联合循环把排气热量送入余热锅炉，再由蒸汽轮机追加发电</text>
  <text class="ph-lbls" x="310" y="92" text-anchor="middle">简单循环 · 启动快 / 结构短</text><text class="ph-lbls" x="760" y="92" text-anchor="middle">联合循环 · 余热利用 / 系统更复杂</text>
  <g class="ph-hot" data-part="gt-air-inlet"><path class="ph-ln" d="M66 180h62l22 48-22 48H66z"/><path class="ph-ln2" d="M80 200h38M80 228h48M80 256h38"/><text class="ph-lbl" x="108" y="320" text-anchor="middle">进气过滤</text></g>
  <g class="ph-hot" data-part="gt-compressor"><circle class="ph-fill ph-ln" cx="226" cy="228" r="58"/><path class="ph-ln2" d="M178 228h96M226 180v96M192 194l68 68M260 194l-68 68"/><text class="ph-lbl" x="226" y="320" text-anchor="middle">压气机</text><text class="ph-lbls" x="226" y="335" text-anchor="middle">空气增压</text></g>
  <g class="ph-hot" data-part="gt-combustor"><path class="ph-fill ph-ln" d="M338 184h82l24 44-24 44h-82l-24-44z"/><path class="ph-flow" d="M350 154v30"/><text class="ph-lbl" x="379" y="320" text-anchor="middle">燃烧室</text><text class="ph-lbls" x="379" y="335" text-anchor="middle">天然气 + 压缩空气</text></g>
  <g class="ph-hot" data-part="gt-turbine"><circle class="ph-fill ph-ln" cx="530" cy="228" r="58"/><path class="ph-ln2" d="M482 228h96M530 180v96M496 194l68 68M564 194l-68 68"/><text class="ph-lbl" x="530" y="320" text-anchor="middle">透平</text><text class="ph-lbls" x="530" y="335" text-anchor="middle">输出轴功率</text></g>
  <g class="ph-hot" data-part="gt-generator-detail"><circle class="ph-fill ph-ln" cx="680" cy="228" r="52"/><circle class="ph-ln2" cx="680" cy="228" r="25" fill="none"/><text class="ph-die" x="680" y="234" text-anchor="middle">G</text><text class="ph-lbl" x="680" y="320" text-anchor="middle">同步发电机</text><text class="ph-lbls" x="680" y="335" text-anchor="middle">交流电输出</text></g>
  <g class="ph-hot" data-part="gt-mv-bus"><rect class="ph-fill ph-ln" x="824" y="184" width="112" height="88" rx="5"/><path class="ph-ln2" d="M842 208h76M842 230h76M842 252h76"/><text class="ph-lbl" x="880" y="320" text-anchor="middle">园区中压母线</text><text class="ph-lbls" x="880" y="335" text-anchor="middle">接入变配电系统</text></g>
  <path class="ph-flow" d="M150 228H168M284 228H314M444 228H472M588 228H628M732 228H824"/>
  <g class="ph-hot" data-part="gt-hrsg-detail"><rect class="ph-fill ph-ln" x="432" y="398" width="150" height="94" rx="5"/><path class="ph-ln2" d="M452 420h110M452 440h110M452 460h110M474 398v94M522 398v94"/><text class="ph-lbl" x="507" y="524" text-anchor="middle">余热锅炉 HRSG</text></g>
  <g class="ph-hot" data-part="gt-steam-turbine"><circle class="ph-fill ph-ln" cx="676" cy="445" r="43"/><path class="ph-ln2" d="M640 445h72M676 409v72M650 419l52 52M702 419l-52 52"/><text class="ph-lbl" x="676" y="524" text-anchor="middle">蒸汽轮机 + 发电机</text></g>
