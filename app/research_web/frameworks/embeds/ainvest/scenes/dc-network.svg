<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" class="ph-scene">
  <text class="ph-lbls" x="45" y="42">数据中心网络：多路由光缆经 DCI 进入 MDA / 核心层，再由 Spine-Leaf 网络把 AI 机柜连接为一个集群</text>
  <g class="ph-hot" data-part="dc-fiber-route"><path class="ph-ln" d="M72 166v230M98 166v230"/><path class="ph-dash" d="M12 196C42 196 46 228 72 228M12 320C42 320 46 292 72 292"/><text class="ph-lbl" x="85" y="432" text-anchor="middle">多路由光缆</text><text class="ph-lbls" x="85" y="447" text-anchor="middle">物理冗余进楼</text></g>
  <g class="ph-hot" data-part="dc-dci-detail"><rect class="ph-fill ph-ln" x="182" y="190" width="122" height="154" rx="5"/><path class="ph-ln2" d="M202 222h82M202 252h82M202 282h82M202 312h82"/><text class="ph-lbl" x="243" y="378" text-anchor="middle">DCI / 进线间</text><text class="ph-lbls" x="243" y="393" text-anchor="middle">波分 · 配线 · 保护</text></g>
  <g class="ph-hot" data-part="dc-mda"><rect class="ph-fill ph-ln" x="392" y="190" width="122" height="154" rx="5"/><path class="ph-ln2" d="M412 222h82M412 252h82M412 282h82M412 312h82"/><text class="ph-lbl" x="453" y="378" text-anchor="middle">MDA / 核心层</text><text class="ph-lbls" x="453" y="393" text-anchor="middle">主配线与汇聚</text></g>
  <g class="ph-hot" data-part="dc-spine"><rect class="ph-chipbg ph-ln" x="600" y="142" width="118" height="86" rx="5"/><path class="ph-ln2" d="M620 165h78M620 187h78"/><text class="ph-lbl" x="659" y="260" text-anchor="middle">Spine</text><text class="ph-lbls" x="659" y="275" text-anchor="middle">骨干交换</text></g>
  <g class="ph-hot" data-part="dc-leaf"><rect class="ph-chipbg ph-ln" x="600" y="332" width="118" height="86" rx="5"/><path class="ph-ln2" d="M620 355h78M620 377h78"/><text class="ph-lbl" x="659" y="450" text-anchor="middle">Leaf / ToR</text><text class="ph-lbls" x="659" y="465" text-anchor="middle">机柜接入</text></g>
  <g class="ph-hot" data-part="dc-optical-module"><rect class="ph-metal ph-ln" x="808" y="162" width="120" height="54" rx="5"/><path class="ph-ln2" d="M830 178h52M830 196h52"/><text class="ph-lbl" x="868" y="248" text-anchor="middle">OSFP / 光模块</text><text class="ph-lbls" x="868" y="263" text-anchor="middle">高速光电转换</text></g>
  <g class="ph-hot" data-part="dc-gpu-rack-network"><rect class="ph-fill ph-ln" x="808" y="332" width="120" height="104" rx="5"/><path class="ph-ln2" d="M826 356h84M826 378h84M826 400h84"/><text class="ph-lbl" x="868" y="470" text-anchor="middle">GPU 机柜列</text><text class="ph-lbls" x="868" y="485" text-anchor="middle">Scale-out 流量</text></g>
  <path class="ph-dash" d="M98 250H182M304 250H392M514 250H600M718 185H808M718 185V375H808"/><path class="ph-dash" d="M718 375H808"/>
  <text class="ph-lbls" x="500" y="530" text-anchor="middle">实际网络可按以太网或 InfiniBand 等协议构建，拓扑层级、端口速率与冗余方式随集群规模调整。</text>
</svg>
