<svg viewBox="0 0 1000 540" xmlns="http://www.w3.org/2000/svg" class="ph-scene">
  <text class="ph-lbls" x="45" y="42">硅片制造：电子级多晶硅 → 单晶生长 → 切磨抛 → 外延 → 晶圆检验 · 前道良率的材料基座</text>
  <path class="ph-flow" d="M80 266H920"/><polygon points="920,261 932,266 920,271" fill="var(--accent)"/>
  <g class="ph-hot" data-part="wafer-feedstock"><rect class="ph-fill ph-ln" x="45" y="190" width="130" height="116" rx="5"/><path class="ph-fill ph-ln2" d="M74 280q16-46 32 0q16-46 32 0"/><text class="ph-lbl" x="110" y="338" text-anchor="middle">电子级多晶硅</text><text class="ph-lbls" x="110" y="353" text-anchor="middle">9N-11N 纯度</text></g>
  <g class="ph-hot" data-part="wafer-crystal"><rect class="ph-fill ph-ln" x="200" y="190" width="130" height="116" rx="5"/><ellipse class="ph-fill ph-ln2" cx="265" cy="220" rx="23" ry="6"/><rect class="ph-fill ph-ln2" x="242" y="220" width="46" height="48"/><path class="ph-ln2" d="M265 200v18M265 268v18"/><text class="ph-lbl" x="265" y="338" text-anchor="middle">CZ 单晶拉棒</text><text class="ph-lbls" x="265" y="353" text-anchor="middle">300mm 硅锭</text></g>
  <g class="ph-hot" data-part="wafer-saw"><rect class="ph-fill ph-ln" x="355" y="190" width="130" height="116" rx="5"/><rect class="ph-metal ph-ln2" x="382" y="232" width="76" height="18"/><path class="ph-ln2" d="M392 222v38M408 222v38M424 222v38M440 222v38"/><text class="ph-lbl" x="420" y="338" text-anchor="middle">切片 / 倒角</text><text class="ph-lbls" x="420" y="353" text-anchor="middle">金刚线与几何控制</text></g>
  <g class="ph-hot" data-part="wafer-polish"><rect class="ph-fill ph-ln" x="510" y="190" width="130" height="116" rx="5"/><ellipse class="ph-fill ph-ln2" cx="575" cy="264" rx="44" ry="11"/><circle class="ph-fill ph-ln2" cx="592" cy="238" r="14"/><path class="ph-lead" d="M592 224v-18"/><text class="ph-lbl" x="575" y="338" text-anchor="middle">研磨 / CMP 抛光</text><text class="ph-lbls" x="575" y="353" text-anchor="middle">镜面级平坦度</text></g>
  <g class="ph-hot" data-part="wafer-epi"><rect class="ph-fill ph-ln" x="665" y="190" width="130" height="116" rx="5"/><ellipse class="ph-fill ph-ln2" cx="730" cy="264" rx="42" ry="9"/><path class="ph-pipe-s" d="M704 208v34M756 208v34"/><path class="ph-ln2" d="M700 246h60"/><text class="ph-lbl" x="730" y="338" text-anchor="middle">外延生长</text><text class="ph-lbls" x="730" y="353" text-anchor="middle">单晶薄层</text></g>
  <g class="ph-hot" data-part="wafer-qualify"><rect class="ph-fill ph-ln" x="820" y="190" width="130" height="116" rx="5"/><ellipse class="ph-fill ph-ln2" cx="875" cy="258" rx="36" ry="8"/><path class="ph-lead" d="M875 210v32"/><circle class="ph-ln2" cx="908" cy="224" r="11" fill="none"/><path class="ph-ln2" d="M916 232l12 12"/><text class="ph-lbl" x="885" y="338" text-anchor="middle">硅片检验</text><text class="ph-lbls" x="885" y="353" text-anchor="middle">缺陷 / 平整度</text></g>
  <text class="ph-lbls" x="500" y="444" text-anchor="middle">硅片直径、缺陷密度、平整度和外延质量决定可支持的器件类型与后续前道良率。</text>
</svg>
