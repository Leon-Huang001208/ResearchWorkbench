<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" class="ph-scene">
  <text class="ph-lbls" x="45" y="42">前道制造循环：每一层都在清洗、成膜、图形化、刻蚀、掺杂、平坦化与量测之间反复迭代</text>
  <path class="ph-flow" d="M82 252H918"/><polygon points="918,247 930,252 918,257" fill="var(--accent)"/>
  <g class="ph-hot" data-part="fe-clean"><rect class="ph-fill ph-ln" x="45" y="182" width="120" height="112" rx="5"/><rect class="ph-fill ph-ln2" x="70" y="230" width="70" height="36"/><path class="ph-pipe-s" d="M88 202v28M122 202v28"/><text class="ph-lbl" x="105" y="326" text-anchor="middle">清洗</text><text class="ph-lbls" x="105" y="341" text-anchor="middle">去颗粒与金属杂质</text></g>
  <g class="ph-hot" data-part="fe-deposition"><rect class="ph-fill ph-ln" x="185" y="182" width="120" height="112" rx="5"/><circle class="ph-fill ph-ln2" cx="245" cy="236" r="28"/><path class="ph-pipe-r" d="M245 198v12"/><ellipse class="ph-ln2" cx="245" cy="252" rx="18" ry="4" fill="none"/><text class="ph-lbl" x="245" y="326" text-anchor="middle">薄膜沉积</text><text class="ph-lbls" x="245" y="341" text-anchor="middle">PVD / CVD / ALD</text></g>
  <g class="ph-hot" data-part="fe-litho"><rect class="ph-fill ph-ln" x="325" y="182" width="120" height="112" rx="5"/><rect class="ph-chipf" x="366" y="198" width="18" height="18"/><path class="ph-lead" d="M375 216v24"/><ellipse class="ph-fill ph-ln2" cx="375" cy="250" rx="34" ry="7"/><text class="ph-lbl" x="385" y="326" text-anchor="middle">光刻</text><text class="ph-lbls" x="385" y="341" text-anchor="middle">胶 / 掩模 / 曝光</text></g>
  <g class="ph-hot" data-part="fe-etch"><rect class="ph-fill ph-ln" x="465" y="182" width="120" height="112" rx="5"/><circle class="ph-fill ph-ln2" cx="525" cy="238" r="27"/><path class="ph-ln2" d="M510 234q5-8 10 0q5 8 10 0q5-8 10 0" fill="none"/><text class="ph-lbl" x="525" y="326" text-anchor="middle">刻蚀</text><text class="ph-lbls" x="525" y="341" text-anchor="middle">图形转移到薄膜</text></g>
  <g class="ph-hot" data-part="fe-implant"><rect class="ph-fill ph-ln" x="605" y="182" width="120" height="112" rx="5"/><path class="ph-lead" d="M628 236h54"/><path class="ph-ln2" d="M662 224l20 12-20 12z"/><ellipse class="ph-fill ph-ln2" cx="690" cy="252" rx="24" ry="6"/><text class="ph-lbl" x="665" y="326" text-anchor="middle">离子注入</text><text class="ph-lbls" x="665" y="341" text-anchor="middle">掺杂调控器件</text></g>
  <g class="ph-hot" data-part="fe-cmp"><rect class="ph-fill ph-ln" x="745" y="182" width="120" height="112" rx="5"/><ellipse class="ph-fill ph-ln2" cx="805" cy="258" rx="42" ry="10"/><circle class="ph-fill ph-ln2" cx="820" cy="232" r="13"/><text class="ph-lbl" x="805" y="326" text-anchor="middle">CMP</text><text class="ph-lbls" x="805" y="341" text-anchor="middle">纳米级平坦化</text></g>
  <g class="ph-hot" data-part="fe-metrology"><rect class="ph-fill ph-ln" x="885" y="182" width="70" height="112" rx="5"/><circle class="ph-ln2" cx="920" cy="235" r="16" fill="none"/><path class="ph-ln2" d="M932 247l12 12"/><text class="ph-lbl" x="920" y="326" text-anchor="middle">量测</text><text class="ph-lbls" x="920" y="341" text-anchor="middle">回到工艺窗口</text></g>
  <g class="ph-hot" data-part="fe-equip"><rect class="ph-fill ph-ln2" x="350" y="420" width="300" height="64" rx="5"/><rect class="ph-chipf" x="378" y="440" width="38" height="22"/><path class="ph-ln2" d="M440 451h34m12-12v24m12-24v24m12-24v24" fill="none"/><circle class="ph-fill ph-ln2" cx="560" cy="451" r="15"/><path class="ph-ln2" d="M552 451h16m-8-8v16"/><text class="ph-lbl" x="500" y="512" text-anchor="middle">半导体设备集群</text><text class="ph-lbls" x="500" y="527" text-anchor="middle">沉积 · 刻蚀 · 清洗 · CMP · 量检测 · 测试</text><g class="ph-plus"><circle cx="630" cy="434" r="8"/><path d="M630 430v8M626 434h8"/></g></g>
  <path class="ph-dash" d="M900 394C740 500 260 500 100 394"/><polygon points="105,400 98,388 113,390" fill="var(--txt3)"/>
  <text class="ph-lbls" x="500" y="530" text-anchor="middle">每完成一层器件或互连，就回到清洗与薄膜工序开始下一轮；先进逻辑和存储的循环次数远高于成熟制程。</text>
</svg>
