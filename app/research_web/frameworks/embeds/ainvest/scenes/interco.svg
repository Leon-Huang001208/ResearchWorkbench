<svg viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" class="ph-scene">
  <text class="ph-lbls" x="45" y="40">光互连形态演进：功耗越来越低、光离芯片越来越近 · 底部为「铜与光」的分工边界</text>

  <!-- 1 可插拔 -->
  <g class="ph-hot" data-part="pluggable">
    <rect class="ph-fill ph-ln2" x="45" y="70" width="210" height="260"/>
    <rect class="ph-fill ph-ln" x="80" y="96" width="36" height="200"/>
    <rect class="ph-ln2" x="86" y="108" width="24" height="14" fill="none"/>
    <rect class="ph-ln2" x="86" y="150" width="24" height="14" fill="none"/>
    <rect class="ph-ln2" x="86" y="192" width="24" height="14" fill="none"/>
    <rect class="ph-ln2" x="86" y="234" width="24" height="14" fill="none"/>
    <rect class="ph-fill ph-ln" x="116" y="106" width="68" height="18" rx="2"/>
    <rect class="ph-fill ph-ln" x="116" y="148" width="68" height="18" rx="2"/>
    <rect class="ph-fill ph-ln" x="116" y="190" width="68" height="18" rx="2"/>
    <rect class="ph-fill ph-ln" x="116" y="232" width="68" height="18" rx="2"/>
    <path class="ph-ln2" d="M184 115 C210 115 216 112 232 112 M184 157 C210 157 216 154 232 154 M184 199 C210 199 216 196 232 196 M184 241 C210 241 216 238 232 238" fill="none"/>
    <text class="ph-lbl" x="150" y="352" text-anchor="middle">可插拔光模块</text>
    <text class="ph-lbls" x="150" y="368" text-anchor="middle">当下主流 · 易维护可替换</text>
  </g>

  <!-- 2 LPO/LRO -->
  <g class="ph-hot" data-part="lpo">
    <rect class="ph-fill ph-ln2" x="295" y="70" width="210" height="260"/>
    <rect class="ph-fill ph-ln" x="330" y="160" width="140" height="40" rx="3"/>
    <rect class="ph-hbm" x="342" y="170" width="26" height="20"/>
    <path class="ph-ln" d="M340 168 L370 192 M370 168 L340 192" fill="none" stroke="var(--up)"/>
    <rect class="ph-chipf" x="386" y="170" width="20" height="20"/>
    <rect class="ph-chipf" x="416" y="170" width="20" height="20"/>
    <path class="ph-lead" d="M400 140 V156"/>
    <text class="ph-lbls" x="400" y="132" text-anchor="middle">砍掉 DSP · 直驱</text>
    <text class="ph-lbl" x="400" y="352" text-anchor="middle">LPO / LRO</text>
    <text class="ph-lbls" x="400" y="368" text-anchor="middle">去 DSP · 功耗降约一半</text>
  </g>

  <!-- 3 CPO -->
  <g class="ph-hot" data-part="cpo-pkg">
    <rect class="ph-fill ph-ln2" x="545" y="70" width="210" height="260"/>
    <rect class="ph-chipf" x="612" y="130" width="76" height="76"/>
    <text class="ph-die" x="650" y="172" text-anchor="middle">交换芯片</text>
    <rect class="ph-hbm" x="588" y="138" width="18" height="14"/>
    <rect class="ph-hbm" x="588" y="160" width="18" height="14"/>
    <rect class="ph-hbm" x="588" y="182" width="18" height="14"/>
    <rect class="ph-hbm" x="694" y="138" width="18" height="14"/>
    <rect class="ph-hbm" x="694" y="160" width="18" height="14"/>
    <rect class="ph-hbm" x="694" y="182" width="18" height="14"/>
    <rect class="ph-hbm" x="620" y="112" width="18" height="14"/>
    <rect class="ph-hbm" x="662" y="112" width="18" height="14"/>
    <path class="ph-ln2" d="M712 145 C728 145 732 141 744 141 M712 167 C728 167 732 165 744 165 M712 189 C728 189 732 191 744 191" fill="none"/>
    <text class="ph-lbls" x="650" y="230" text-anchor="middle">光引擎环绕共封装</text>
  </g>
  <g class="ph-hot" data-part="els">
    <rect class="ph-metal" x="620" y="256" width="60" height="26"/>
    <path class="ph-dash" d="M650 256 V210"/>
    <text class="ph-lbls" x="650" y="298" text-anchor="middle">ELS 外置光源</text>
  </g>
  <text class="ph-lbl" x="650" y="352" text-anchor="middle">CPO 共封装</text>
  <text class="ph-lbls" x="650" y="368" text-anchor="middle">博通/英伟达已出货 · 功耗再降</text>

  <!-- 4 OCS -->
  <g class="ph-hot" data-part="ocs-mems">
    <rect class="ph-fill ph-ln2" x="795" y="70" width="160" height="260"/>
    <rect class="ph-fill ph-ln" x="815" y="110" width="120" height="120"/>
    <path class="ph-ln2" d="M830 130 l14 10 M866 130 l14 10 M902 130 l14 10 M830 166 l14 10 M866 166 l14 10 M902 166 l14 10 M830 202 l14 10 M866 202 l14 10 M902 202 l14 10" fill="none"/>
    <path class="ph-flow" d="M800 96 L872 174 L800 252"/>
    <text class="ph-lbls" x="875" y="252" text-anchor="middle">光直接反射换路</text>
    <text class="ph-lbl" x="875" y="352" text-anchor="middle">OCS 光路交换</text>
    <text class="ph-lbls" x="875" y="368" text-anchor="middle">MEMS 微镜 · 谷歌规模部署</text>
  </g>

  <!-- 演进箭头 -->
  <g class="ph-lead">
    <line x1="258" y1="200" x2="288" y2="200"/>
    <line x1="508" y1="200" x2="538" y2="200"/>
    <line x1="758" y1="200" x2="788" y2="200"/>
  </g>
  <polygon points="288,195 298,200 288,205" fill="var(--txt3)"/>
  <polygon points="538,195 548,200 538,205" fill="var(--txt3)"/>
  <polygon points="788,195 798,200 788,205" fill="var(--txt3)"/>

  <!-- 铜与光的边界 -->
  <g class="ph-hot" data-part="aec">
    <rect class="ph-fill ph-ln" x="120" y="410" width="34" height="56"/>
    <rect class="ph-fill ph-ln" x="300" y="410" width="34" height="56"/>
    <path d="M154 434 H300" stroke="var(--rating-txt)" stroke-width="3" fill="none"/>
    <text class="ph-lbls" x="227" y="426" text-anchor="middle">柜内/邻柜：铜</text>
    <text class="ph-lbls" x="227" y="484" text-anchor="middle">NVLink 背板 · DAC/AEC ≤ 2-3m</text>
  </g>
  <rect class="ph-fill ph-ln" x="560" y="410" width="34" height="56"/>
  <rect class="ph-fill ph-ln" x="880" y="410" width="34" height="56"/>
  <path class="ph-flow" d="M594 434 H880"/>
  <text class="ph-lbls" x="737" y="426" text-anchor="middle">跨柜/跨机房：光</text>
  <text class="ph-lbls" x="737" y="484" text-anchor="middle">光模块 + 光纤 · 距离不敏感</text>
</svg>
