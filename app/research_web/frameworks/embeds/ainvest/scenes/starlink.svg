<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" class="ph-scene">
  <text class="ph-lbls" x="45" y="38">卫星互联网算力节点：星链在轨超 1 万颗 · 天地一体化通信体系正在形成</text>

  <!-- 卫星本体 -->
  <g class="ph-hot" data-part="sat-bus">
    <rect class="ph-fill ph-ln2" x="45" y="60" width="300" height="220"/>
    <rect class="ph-fill ph-ln" x="150" y="130" width="90" height="70"/>
    <line class="ph-ln2" x1="150" y1="150" x2="240" y2="150"/>
    <line class="ph-ln2" x1="150" y1="170" x2="240" y2="170"/>
    <path class="ph-fill ph-ln" d="M70 150 H150 V180 H70 Z"/>
    <path class="ph-lead" d="M78 156 V174 M90 156 V174 M102 156 V174 M114 156 V174 M126 156 V174 M138 156 V174"/>
    <path class="ph-fill ph-ln" d="M240 150 H320 V180 H240 Z"/>
    <path class="ph-lead" d="M248 156 V174 M260 156 V174 M272 156 V174 M284 156 V174 M296 156 V174 M308 156 V174"/>
    <text class="ph-lbl" x="195" y="242" text-anchor="middle">卫星总线 · 可展开太阳翼</text>
    <text class="ph-lbls" x="195" y="258" text-anchor="middle">V3 平台 · 单星发射质量显著提升</text>
  </g>

  <!-- 星间激光链路 -->
  <g class="ph-hot" data-part="sat-laser-isl">
    <rect class="ph-fill ph-ln2" x="365" y="60" width="270" height="220"/>
    <circle class="ph-fill ph-ln" cx="440" cy="170" r="26"/>
