    <rect class="ph-fill ph-ln2" x="45" y="312" width="270" height="220"/>
    <path class="ph-fill ph-ln" d="M170 340 L184 380 V480 L170 500 L156 480 V380 Z"/>
    <line class="ph-ln2" x1="163" y1="380" x2="163" y2="470"/>
    <line class="ph-ln2" x1="177" y1="380" x2="177" y2="470"/>
    <path class="ph-fill ph-ln2" d="M156 470 L140 500 H156 Z"/>
    <path class="ph-fill ph-ln2" d="M184 470 L200 500 H184 Z"/>
    <path d="M163 500 C150 520 150 500 145 522 M177 500 C190 520 190 500 195 522" stroke="var(--rating-txt)" stroke-width="3" fill="none"/>
