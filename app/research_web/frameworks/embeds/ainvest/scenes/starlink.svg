    <circle class="ph-bm" cx="720" cy="108" r="2.6"/><circle class="ph-bm" cx="740" cy="108" r="2.6"/><circle class="ph-bm" cx="760" cy="108" r="2.6"/><circle class="ph-bm" cx="780" cy="108" r="2.6"/><circle class="ph-bm" cx="800" cy="108" r="2.6"/><circle class="ph-bm" cx="820" cy="108" r="2.6"/><circle class="ph-bm" cx="840" cy="108" r="2.6"/><circle class="ph-bm" cx="860" cy="108" r="2.6"/><circle class="ph-bm" cx="880" cy="108" r="2.6"/>
    <circle class="ph-bm" cx="720" cy="128" r="2.6"/><circle class="ph-bm" cx="740" cy="128" r="2.6"/><circle class="ph-bm" cx="760" cy="128" r="2.6"/><circle class="ph-bm" cx="780" cy="128" r="2.6"/><circle class="ph-bm" cx="800" cy="128" r="2.6"/><circle class="ph-bm" cx="820" cy="128" r="2.6"/><circle class="ph-bm" cx="840" cy="128" r="2.6"/><circle class="ph-bm" cx="860" cy="128" r="2.6"/><circle class="ph-bm" cx="880" cy="128" r="2.6"/>
    <circle class="ph-bm" cx="720" cy="148" r="2.6"/><circle class="ph-bm" cx="740" cy="148" r="2.6"/><circle class="ph-bm" cx="760" cy="148" r="2.6"/><circle class="ph-bm" cx="780" cy="148" r="2.6"/><circle class="ph-bm" cx="800" cy="148" r="2.6"/><circle class="ph-bm" cx="820" cy="148" r="2.6"/><circle class="ph-bm" cx="840" cy="148" r="2.6"/><circle class="ph-bm" cx="860" cy="148" r="2.6"/><circle class="ph-bm" cx="880" cy="148" r="2.6"/>
    <rect class="ph-chipf" x="740" y="196" width="30" height="20"/>
    <rect class="ph-chipf" x="790" y="196" width="30" height="20"/>
