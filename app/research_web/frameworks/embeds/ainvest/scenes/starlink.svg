    <rect class="ph-fill ph-ln2" x="535" y="480" width="36" height="60" rx="4"/>
    <line class="ph-ln2" x1="541" y1="530" x2="565" y2="530"/>
    <circle class="ph-fill ph-ln" cx="480" cy="345" r="7"/>
    <text class="ph-lbls" x="480" y="330" text-anchor="middle">Direct-to-Cell 卫星直连</text>
    <text class="ph-lbl" x="480" y="564" text-anchor="middle">StarlinkMobile 手机直连</text>
  </g>

  <!-- 地面站/信关站 -->
  <g class="ph-hot" data-part="ground-station">
    <rect class="ph-fill ph-ln2" x="655" y="312" width="300" height="220"/>
    <path class="ph-fill ph-ln" d="M760 480 V430 A46 46 0 0 1 852 430 V480 Z"/>
    <line class="ph-ln2" x1="806" y1="430" x2="806" y2="400"/>
    <rect class="ph-fill ph-ln2" x="798" y="392" width="16" height="10"/>
    <rect class="ph-fill ph-ln" x="742" y="480" width="126" height="18"/>
    <path class="ph-flow" d="M806 392 L806 350"/>
    <polygon points="801,354 806,344 811,354" fill="var(--accent)"/>
    <text class="ph-lbls" x="806" y="336" text-anchor="middle">馈电链路 · 光缆入网</text>
    <text class="ph-lbl" x="806" y="522" text-anchor="middle">地面信关站</text>
    <text class="ph-lbls" x="806" y="538" text-anchor="middle">连接骨干网 · 覆盖 32+ 国家</text>
  </g>

  <text class="ph-lbls" x="500" y="576" text-anchor="middle">卫星通信是端侧 AI 的网络延伸：偏远地区/海事/应急场景补齐地面网络覆盖盲区</text>
