  </g>
  <path class="ph-lead" d="M450 420v46H790v-46"/><text class="ph-lbl" x="620" y="500" text-anchor="middle">金属互连（Vias）完成晶圆键合</text><text class="ph-lbls" x="620" y="521" text-anchor="middle">分别优化后再集成，兼顾存储密度、I/O 速度与芯片面积</text>
  <text class="ph-lbls" x="500" y="570" text-anchor="middle">结构示意参考：长江存储公开资料、广发证券《电子行业2026年中期策略：AI创新与存储周期》图 46</text>
