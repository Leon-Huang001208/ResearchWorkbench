<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" class="ph-scene">
  <text class="ph-lbls" x="45" y="42">国产 3D NAND · Xtacking：CMOS 外围电路与 NAND 阵列分别制造，再以高密度金属互连键合为一体</text>
