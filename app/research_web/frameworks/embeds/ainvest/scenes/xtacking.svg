    <text class="ph-lbl" x="450" y="340" text-anchor="middle">NAND 存储阵列晶圆</text><text class="ph-lbls" x="450" y="357" text-anchor="middle">3D 堆叠 · 通道孔 / 字线</text>
  </g>
  <path class="ph-flow" d="M582 224h74"/>
