<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" class="ph-scene">
  <text class="ph-lbls" x="45" y="42">DRAM / DDR 结构：DRAM die 中由存储阵列、行列译码、感放与 I/O 组成；颗粒再装到 DIMM、SOCAMM 等内存模组</text>
  <g class="ph-hot" data-part="dram-array"><rect class="ph-fill ph-ln" x="90" y="132" width="288" height="210" rx="5"/><path class="ph-ln2" d="M120 164h228M120 188h228M120 212h228M120 236h228M120 260h228M120 284h228M150 150v174M180 150v174M210 150v174M240 150v174M270 150v174M300 150v174M330 150v174"/><text class="ph-lbl" x="234" y="374" text-anchor="middle">DRAM 存储阵列</text><text class="ph-lbls" x="234" y="389" text-anchor="middle">单元阵列 / 电容保存电荷</text></g>
  <g class="ph-hot" data-part="dram-periphery"><rect class="ph-chipf ph-ln" x="442" y="132" width="168" height="72" rx="5"/><text class="ph-die" x="526" y="174" text-anchor="middle">行列译码 / 感放</text><rect class="ph-chipf ph-ln" x="442" y="244" width="168" height="72" rx="5"/><text class="ph-die" x="526" y="286" text-anchor="middle">I/O PHY / DDR 接口</text><text class="ph-lbl" x="526" y="374" text-anchor="middle">外围电路</text></g>
  <path class="ph-flow" d="M378 236H442M610 280H710"/>
  <g class="ph-hot" data-part="ddr-package"><rect class="ph-hbm ph-ln" x="710" y="134" width="142" height="88" rx="4"/><text class="ph-die" x="781" y="186" text-anchor="middle">DRAM Package</text><text class="ph-lbls" x="781" y="250" text-anchor="middle">DDR / LPDDR 颗粒</text></g>
  <g class="ph-hot" data-part="ddr-module"><rect class="ph-metal ph-ln" x="698" y="342" width="172" height="42" rx="3"/><rect class="ph-hbm" x="716" y="350" width="22" height="22"/><rect class="ph-hbm" x="748" y="350" width="22" height="22"/><rect class="ph-hbm" x="780" y="350" width="22" height="22"/><rect class="ph-hbm" x="812" y="350" width="22" height="22"/><text class="ph-lbl" x="784" y="420" text-anchor="middle">DIMM / SOCAMM 模组</text><text class="ph-lbls" x="784" y="435" text-anchor="middle">颗粒 + PCB + 接口</text></g>
  <path class="ph-dash" d="M781 222V342"/>
  <text class="ph-lbls" x="500" y="530" text-anchor="middle">DDR、LPDDR 等标准主要定义接口与电气特征；不同平台的颗粒封装、通道数和模组形态会不同。</text>
</svg>
