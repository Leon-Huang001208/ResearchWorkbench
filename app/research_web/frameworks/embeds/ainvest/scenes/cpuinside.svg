  </g>

  <g class="ph-hot" data-part="cpu-cxl-pool">
    <rect class="ph-fill ph-ln" x="752" y="132" width="174" height="104" rx="6"/>
    <rect class="ph-metal ph-ln2" x="774" y="154" width="58" height="58"/>
    <rect class="ph-metal ph-ln2" x="846" y="154" width="58" height="58"/>
