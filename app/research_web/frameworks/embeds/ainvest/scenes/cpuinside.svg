    <text class="ph-lbls" x="839" y="285" text-anchor="middle">KV Cache 池化 / 一致性共享</text>
    <path class="ph-dash" d="M700 190H752"/>
    <g class="ph-plus"><circle cx="914" cy="144" r="8"/><path d="M914 140v8M910 144h8"/></g>
  </g>

  <g class="ph-hot" data-part="cpu-inference-roles">
    <rect class="ph-fill ph-ln" x="750" y="334" width="180" height="126" rx="6"/>
    <text class="ph-lbl" x="840" y="366" text-anchor="middle">CPU 推理任务</text>
    <path class="ph-ln2" d="M774 388h132M774 414h132M774 440h132"/>
    <text class="ph-lbls" x="840" y="405" text-anchor="middle">Decode / 小 Batch</text>
    <text class="ph-lbls" x="840" y="431" text-anchor="middle">RAG / KV Cache</text>
    <text class="ph-lbls" x="840" y="457" text-anchor="middle">Agent 调度 / 工具调用</text>
    <path class="ph-dash" d="M700 320H750"/>
  </g>

  <text class="ph-lbls" x="500" y="555" text-anchor="middle">CPU 与 GPU 的角色不是替代：GPU 承担高并行矩阵吞吐，CPU 擅长低时延、控制、内存与异构任务编排。</text>
</svg>
