  <g class="ph-hot" data-part="siph-ge-pd"><rect class="ph-hbm ph-ln" x="706" y="186" width="92" height="70" rx="4"/><text class="ph-die" x="752" y="226" text-anchor="middle">Ge PD</text><text class="ph-lbl" x="752" y="290" text-anchor="middle">锗探测器</text></g>
  <g class="ph-hot" data-part="siph-coupler"><rect class="ph-metal ph-ln" x="844" y="190" width="90" height="62" rx="4"/><path class="ph-ln2" d="M858 202v38M870 202v38M882 202v38M894 202v38M906 202v38"/><text class="ph-lbl" x="889" y="290" text-anchor="middle">光栅 / 边缘耦合</text></g>
