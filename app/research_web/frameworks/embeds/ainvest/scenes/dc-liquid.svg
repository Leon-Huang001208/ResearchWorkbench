<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" class="ph-scene">
  <text class="ph-lbls" x="45" y="42">数据中心液冷：室外一次侧把冷量送入 CDU，室内二次侧经歧管、快接头与冷板带走芯片热量</text>
  <text class="ph-lbls" x="248" y="96" text-anchor="middle">一次侧 / 室外冷源</text><text class="ph-lbls" x="716" y="96" text-anchor="middle">二次侧 / 机房冷却液</text>
  <g class="ph-hot" data-part="dc-cooling-tower-detail"><rect class="ph-fill ph-ln" x="72" y="164" width="118" height="102" rx="5"/><circle class="ph-ln2" cx="131" cy="211" r="25" fill="none"/><path class="ph-ln2" d="M106 211h50M131 186v50"/><text class="ph-lbl" x="131" y="300" text-anchor="middle">冷却塔</text><text class="ph-lbls" x="131" y="315" text-anchor="middle">向环境排热</text></g>
  <g class="ph-hot" data-part="dc-chiller-detail"><rect class="ph-fill ph-ln" x="262" y="164" width="132" height="102" rx="5"/><circle class="ph-ln2" cx="302" cy="215" r="22" fill="none"/><circle class="ph-ln2" cx="354" cy="215" r="22" fill="none"/><text class="ph-lbl" x="328" y="300" text-anchor="middle">冷水机组</text><text class="ph-lbls" x="328" y="315" text-anchor="middle">制冷 / 换热</text></g>
  <g class="ph-hot" data-part="dc-cdu-detail"><rect class="ph-fill ph-ln" x="475" y="142" width="132" height="146" rx="5"/><path class="ph-ln2" d="M500 174h82M500 198h82M500 222h82M520 154v122M560 154v122"/><circle class="ph-ln2" cx="540" cy="250" r="13" fill="none"/><text class="ph-lbl" x="541" y="322" text-anchor="middle">CDU</text><text class="ph-lbls" x="541" y="337" text-anchor="middle">隔离换热 · 泵组 · 控制</text></g>
  <g class="ph-hot" data-part="dc-manifold"><rect class="ph-fill ph-ln" x="682" y="176" width="72" height="76" rx="5"/><path class="ph-ln2" d="M700 192v44M718 192v44M736 192v44"/><text class="ph-lbl" x="718" y="286" text-anchor="middle">歧管</text><text class="ph-lbls" x="718" y="301" text-anchor="middle">分配到机柜</text></g>
  <g class="ph-hot" data-part="dc-quick-connect"><path class="ph-ln" d="M806 202h64M806 226h64"/><circle class="ph-fill ph-ln2" cx="826" cy="214" r="13"/><circle class="ph-fill ph-ln2" cx="850" cy="214" r="13"/><text class="ph-lbl" x="838" y="286" text-anchor="middle">快接头</text><text class="ph-lbls" x="838" y="301" text-anchor="middle">UQD / 维护隔离</text></g>
  <g class="ph-hot" data-part="dc-cold-plate"><rect class="ph-metal ph-ln" x="810" y="382" width="132" height="72" rx="5"/><rect class="ph-chipf" x="852" y="398" width="48" height="30"/><path class="ph-ln2" d="M826 438h100"/><text class="ph-lbl" x="876" y="490" text-anchor="middle">冷板 / 芯片</text><text class="ph-lbls" x="876" y="505" text-anchor="middle">直接带走 GPU 热量</text></g>
  <path class="ph-pipe-s" d="M190 206H262M394 206H475M607 206H682M754 206H806M838 240V382"/><path class="ph-pipe-r" d="M838 250V366H630V250M475 244H394M262 244H190"/>
  <text class="ph-lbls" x="500" y="540" text-anchor="middle">当前 AI 机房以冷板式为主；浸没式和喷淋式是不同的系统路线，适配的运维与服务器设计也不同。</text>
</svg>
