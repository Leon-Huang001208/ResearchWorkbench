<svg viewBox="0 0 1000 540" xmlns="http://www.w3.org/2000/svg" class="ph-scene">
  <!-- 建筑外壳 -->
  <rect class="ph-fill ph-ln" x="110" y="120" width="830" height="360"/>
  <line class="ph-ln2" x1="110" y1="160" x2="940" y2="160"/>
