  <line class="ph-ln2" x1="10" y1="480" x2="990" y2="480"/>
  <!-- 房间隔墙 -->
  <line class="ph-ln2" x1="250" y1="160" x2="250" y2="480"/>
  <line class="ph-ln2" x1="388" y1="160" x2="388" y2="480"/>
  <line class="ph-ln2" x1="652" y1="160" x2="652" y2="480"/>
  <line class="ph-ln2" x1="780" y1="160" x2="780" y2="480"/>
  <line class="ph-ln2" x1="868" y1="160" x2="868" y2="480"/>

  <!-- 房间名 -->
