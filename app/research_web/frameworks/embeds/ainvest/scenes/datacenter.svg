    <g class="ph-plus"><circle cx="304" cy="382" r="9"/><path d="M304 378 v8 M300 382 h8"/></g>
  </g>

  <!-- 电池间 -->
  <g class="ph-hot" data-part="battery-room">
    <rect class="ph-fill ph-ln" x="322" y="400" width="58" height="80"/>
    <line class="ph-ln2" x1="322" y1="420" x2="380" y2="420"/>
    <line class="ph-ln2" x1="322" y1="440" x2="380" y2="440"/>
    <line class="ph-ln2" x1="322" y1="460" x2="380" y2="460"/>
