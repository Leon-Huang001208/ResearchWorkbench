  </g>

  <!-- 机房白区（可下钻） -->
  <g class="ph-hot" data-part="server-hall">
    <rect class="ph-fill ph-ln2" x="410" y="300" width="24" height="58"/>
    <rect class="ph-fill ph-ln2" x="442" y="300" width="24" height="58"/>
    <rect class="ph-fill ph-ln2" x="474" y="300" width="24" height="58"/>
    <rect class="ph-fill ph-ln2" x="506" y="300" width="24" height="58"/>
    <rect class="ph-fill ph-ln2" x="538" y="300" width="24" height="58"/>
    <rect class="ph-fill ph-ln2" x="570" y="300" width="24" height="58"/>
    <line class="ph-ln2" x1="410" y1="318" x2="594" y2="318"/>
    <rect class="ph-fill ph-ln" x="406" y="386" width="28" height="94"/>
    <rect class="ph-fill ph-ln" x="444" y="386" width="28" height="94"/>
    <rect class="ph-fill ph-ln" x="482" y="386" width="28" height="94"/>
    <rect class="ph-fill ph-ln" x="520" y="386" width="28" height="94"/>
    <rect class="ph-fill ph-ln" x="558" y="386" width="28" height="94"/>
    <line class="ph-ln2" x1="406" y1="412" x2="586" y2="412"/>
    <line class="ph-ln2" x1="406" y1="440" x2="586" y2="440"/>
