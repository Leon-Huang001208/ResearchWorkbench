  </g>

  <!-- 国产超节点：与英伟达机柜并排的另一种机柜实体，画成自己的样子 -->
  <g class="ph-hot" data-part="domestic-rack-mini">
    <rect class="ph-fill ph-ln" x="600" y="306" width="42" height="174"/>
    <rect class="ph-metal" x="604" y="310" width="34" height="14"/>
    <line class="ph-ln2" x1="604" y1="332" x2="638" y2="332"/>
    <line class="ph-ln2" x1="604" y1="350" x2="638" y2="350"/>
    <line class="ph-ln2" x1="604" y1="368" x2="638" y2="368"/>
    <line class="ph-ln2" x1="604" y1="386" x2="638" y2="386"/>
    <line class="ph-ln2" x1="604" y1="404" x2="638" y2="404"/>
    <line class="ph-ln2" x1="604" y1="422" x2="638" y2="422"/>
    <line class="ph-ln2" x1="604" y1="440" x2="638" y2="440"/>
    <line class="ph-ln2" x1="604" y1="458" x2="638" y2="458"/>
    <g class="ph-plus"><circle cx="638" cy="296" r="9"/><path d="M638 292 v8 M634 296 h8"/></g>
    <text class="ph-lbls" x="621" y="280" text-anchor="middle">国产超节点</text>
  </g>

  <!-- 卫星互联网：屋顶的另一种链路，画成卫星本体的样子 -->
  <g class="ph-hot" data-part="starlink-roof">
    <rect class="ph-fill ph-ln2" x="440" y="86" width="16" height="24"/>
    <rect class="ph-fill ph-ln2" x="524" y="86" width="16" height="24"/>
    <path class="ph-ln2" d="M456 98 H479 M501 98 H524"/>
    <circle class="ph-fill ph-ln" cx="490" cy="98" r="11"/>
    <path class="ph-ln2" d="M490 87 V76 M484 80 L490 74 L496 80" fill="none"/>
    <path class="ph-dash" d="M490 109 V150"/>
    <g class="ph-plus"><circle cx="548" cy="78" r="9"/><path d="M548 74 v8 M544 78 h8"/></g>
    <text class="ph-lbl" x="490" y="56" text-anchor="middle">卫星互联网</text>
  </g>

  <!-- CDU -->
  <g class="ph-hot" data-part="cdu">
    <rect class="ph-fill ph-ln" x="608" y="396" width="36" height="84"/>
    <circle class="ph-ln2" cx="626" cy="420" r="8" fill="none"/>
    <line class="ph-ln2" x1="608" y1="444" x2="644" y2="444"/>
    <line class="ph-ln2" x1="608" y1="460" x2="644" y2="460"/>
