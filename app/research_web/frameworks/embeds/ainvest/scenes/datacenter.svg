    <g class="ph-plus"><circle cx="88" cy="398" r="9"/><path d="M88 394 v8 M84 398 h8"/></g>
  </g>

  <!-- 变配电室 -->
  <g class="ph-hot" data-part="dc-transformer">
    <rect class="ph-fill ph-ln" x="132" y="368" width="52" height="112"/>
    <line class="ph-ln" x1="142" y1="368" x2="142" y2="346"/>
    <line class="ph-ln" x1="158" y1="368" x2="158" y2="346"/>
    <line class="ph-ln" x1="174" y1="368" x2="174" y2="346"/>
    <line class="ph-ln2" x1="138" y1="354" x2="146" y2="354"/>
    <line class="ph-ln2" x1="154" y1="354" x2="162" y2="354"/>
    <line class="ph-ln2" x1="170" y1="354" x2="178" y2="354"/>
    <rect class="ph-fill ph-ln2" x="196" y="396" width="20" height="84"/>
    <rect class="ph-fill ph-ln2" x="220" y="396" width="20" height="84"/>
    <text class="ph-lbls" x="158" y="340" text-anchor="middle">变压器</text>
    <g class="ph-plus"><circle cx="228" cy="354" r="9"/><path d="M228 350 v8 M224 354 h8"/></g>
  </g>

  <!-- UPS/HVDC -->
  <g class="ph-hot" data-part="ups-room">
    <rect class="ph-fill ph-ln" x="262" y="400" width="22" height="80"/>
    <rect class="ph-fill ph-ln" x="288" y="400" width="22" height="80"/>
    <line class="ph-ln2" x1="262" y1="420" x2="284" y2="420"/>
    <line class="ph-ln2" x1="288" y1="420" x2="310" y2="420"/>
    <circle class="ph-ln2" cx="273" cy="440" r="4" fill="none"/>
    <circle class="ph-ln2" cx="299" cy="440" r="4" fill="none"/>
