  <g class="ph-hot" data-part="network-room">
    <rect class="ph-fill ph-ln" x="682" y="396" width="30" height="84"/>
    <rect class="ph-fill ph-ln" x="722" y="396" width="30" height="84"/>
    <path class="ph-ln2" d="M686 410 L708 426 M708 410 L686 426" fill="none"/>
    <path class="ph-ln2" d="M726 410 L748 426 M748 410 L726 426" fill="none"/>
    <line class="ph-ln2" x1="682" y1="440" x2="712" y2="440"/>
    <line class="ph-ln2" x1="722" y1="440" x2="752" y2="440"/>
