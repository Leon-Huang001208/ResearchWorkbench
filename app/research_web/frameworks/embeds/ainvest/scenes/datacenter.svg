    <rect class="ph-ln2" x="344" y="406" width="12" height="9" fill="none"/>
    <rect class="ph-ln2" x="360" y="406" width="12" height="9" fill="none"/>
    <rect class="ph-ln2" x="328" y="426" width="12" height="9" fill="none"/>
    <rect class="ph-ln2" x="344" y="426" width="12" height="9" fill="none"/>
    <rect class="ph-ln2" x="360" y="426" width="12" height="9" fill="none"/>
