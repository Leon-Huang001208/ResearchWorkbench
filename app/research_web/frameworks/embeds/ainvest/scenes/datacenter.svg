  <text class="ph-lbl" x="520" y="182" text-anchor="middle">机房白区 · 机柜列</text>
  <text class="ph-lbl" x="716" y="182" text-anchor="middle">网络间</text>
  <text class="ph-lbl" x="824" y="182" text-anchor="middle">进线间</text>
  <text class="ph-lbl" x="904" y="182" text-anchor="middle">冷冻站</text>

  <!-- 柴油发电机（楼外） -->
  <g class="ph-hot" data-part="dg-plant">
    <rect class="ph-fill ph-ln" x="16" y="412" width="82" height="68"/>
    <rect class="ph-fill ph-ln2" x="84" y="386" width="9" height="26"/>
    <line class="ph-ln2" x1="24" y1="430" x2="76" y2="430"/>
