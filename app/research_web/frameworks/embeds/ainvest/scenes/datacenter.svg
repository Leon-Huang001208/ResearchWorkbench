    <g class="ph-plus"><circle cx="744" cy="382" r="9"/><path d="M744 378 v8 M740 382 h8"/></g>
  </g>

  <!-- 进线间 / DCI -->
  <g class="ph-hot" data-part="fiber-entry">
    <rect class="ph-fill ph-ln" x="794" y="410" width="60" height="70"/>
    <line class="ph-ln2" x1="794" y1="432" x2="854" y2="432"/>
    <line class="ph-ln2" x1="794" y1="454" x2="854" y2="454"/>
    <path class="ph-ln2" d="M985 440 C930 440 910 444 854 444" fill="none"/>
    <path class="ph-ln2" d="M985 452 C930 452 910 462 854 462" fill="none"/>
    <text class="ph-lbls" x="824" y="402" text-anchor="middle">光缆进楼</text>
    <g class="ph-plus"><circle cx="846" cy="396" r="9"/><path d="M846 392 v8 M842 396 h8"/></g>
  </g>

  <!-- 冷冻站 -->
  <g class="ph-hot" data-part="chiller-plant">
    <rect class="ph-fill ph-ln" x="876" y="408" width="56" height="72"/>
    <circle class="ph-ln2" cx="892" cy="432" r="9" fill="none"/>
    <circle class="ph-ln2" cx="916" cy="432" r="9" fill="none"/>
    <line class="ph-ln2" x1="876" y1="456" x2="932" y2="456"/>
    <text class="ph-lbls" x="904" y="400" text-anchor="middle">冷水机组</text>
    <g class="ph-plus"><circle cx="924" cy="394" r="9"/><path d="M924 390 v8 M920 394 h8"/></g>
  </g>

  <!-- 冷却塔（屋顶） -->
  <g class="ph-hot" data-part="cooling-tower">
    <rect class="ph-fill ph-ln" x="762" y="66" width="70" height="54"/>
    <circle class="ph-ln" cx="797" cy="84" r="13" fill="none"/>
    <line class="ph-ln2" x1="797" y1="71" x2="797" y2="97"/>
    <line class="ph-ln2" x1="784" y1="84" x2="810" y2="84"/>
    <line class="ph-ln2" x1="768" y1="106" x2="826" y2="106"/>
    <rect class="ph-fill ph-ln" x="846" y="66" width="70" height="54"/>
    <circle class="ph-ln" cx="881" cy="84" r="13" fill="none"/>
    <line class="ph-ln2" x1="881" y1="71" x2="881" y2="97"/>
    <line class="ph-ln2" x1="868" y1="84" x2="894" y2="84"/>
    <line class="ph-ln2" x1="852" y1="106" x2="910" y2="106"/>
    <text class="ph-lbl" x="838" y="56" text-anchor="middle">冷却塔</text>
    <g class="ph-plus"><circle cx="906" cy="54" r="9"/><path d="M906 50 v8 M902 54 h8"/></g>
  </g>

  <!-- 冷冻水管：冷机 → 天花 → CDU；冷机 → 屋顶冷却塔 -->
  <g class="ph-hot" data-part="dc-liquid-loop">
    <path class="ph-pipe-s" d="M890 408 V140 H630 V396"/>
    <path class="ph-pipe-r" d="M902 408 V148 H638 V396"/>
    <path class="ph-pipe-s" d="M914 408 V120 M914 120 V108"/>
    <text class="ph-lbls" x="758" y="134" text-anchor="middle">冷冻水 供/回</text>
    <g class="ph-plus"><circle cx="758" cy="150" r="9"/><path d="M758 146 v8 M754 150 h8"/></g>
  </g>

  <!-- 电力流：市电+柴发 → 变配电 → UPS → 白区 -->
  <path class="ph-flow" d="M98 446 H132"/>
  <path class="ph-flow" d="M184 452 H406"/>
  <polygon points="400,447 410,452 400,457" fill="var(--accent)"/>
  <text class="ph-lbls" x="300" y="470" text-anchor="middle">10kV → 400V/800V DC</text>

  <!-- 光纤流：进线间 → 网络间 → 白区 -->
  <path class="ph-dash" d="M794 468 H752"/>
  <path class="ph-dash" d="M682 430 C650 400 620 360 594 330"/>
</svg>
