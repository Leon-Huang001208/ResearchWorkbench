<svg viewBox="0 0 1000 650" xmlns="http://www.w3.org/2000/svg" class="ph-scene">
  <text class="ph-lbls" x="45" y="40">硬件制造供应链 · 五条关键链路，点击进入</text>

  <!-- 顶部五条制造链：统一宽度、等间距 -->
  <g class="ph-hot" data-part="chip-factory">
    <path class="ph-ln" d="M45 76L45 60 82 76 82 60 119 76 119 60 156 76 156 60 193 76" fill="none"/><rect class="ph-fill ph-ln" x="45" y="76" width="150" height="62"/>
    <circle class="ph-ln" cx="96" cy="107" r="17"/><path class="ph-ln2" d="M82 101h28M80 108h32M82 115h28M89 92v32M97 90v36M105 92v32"/><rect class="ph-chipf" x="150" y="97" width="20" height="20"/>
    <g class="ph-plus"><circle cx="181" cy="90" r="9"/><path d="M181 86v8M177 90h8"/></g><text class="ph-lbl" x="120" y="156" text-anchor="middle">芯片制造链</text><text class="ph-lbls" x="120" y="170" text-anchor="middle">石英砂 → GPU</text>
  </g>
  <g class="ph-hot" data-part="pcb-factory">
    <path class="ph-ln" d="M235 76L235 60 272 76 272 60 309 76 309 60 346 76 346 60 383 76" fill="none"/><rect class="ph-fill ph-ln" x="235" y="76" width="150" height="62"/>
