    <g class="ph-plus"><circle cx="371" cy="90" r="9"/><path d="M371 86v8M367 90h8"/></g><text class="ph-lbl" x="310" y="156" text-anchor="middle">PCB/CCL 制造链</text><text class="ph-lbls" x="310" y="170" text-anchor="middle">电子布 → CCL → 五类 AI PCB</text>
  </g>
  <g class="ph-hot" data-part="mem-factory">
    <path class="ph-ln" d="M425 76L425 60 462 76 462 60 499 76 499 60 536 76 536 60 573 76" fill="none"/><rect class="ph-fill ph-ln" x="425" y="76" width="150" height="62"/>
    <rect class="ph-hbm" x="470" y="116" width="60" height="10"/><rect class="ph-hbm" x="474" y="104" width="52" height="10"/><rect class="ph-hbm" x="478" y="92" width="44" height="10"/><rect class="ph-chipf" x="486" y="84" width="28" height="7"/>
    <g class="ph-plus"><circle cx="561" cy="90" r="9"/><path d="M561 86v8M557 90h8"/></g><text class="ph-lbl" x="500" y="156" text-anchor="middle">存储制造链</text><text class="ph-lbls" x="500" y="170" text-anchor="middle">DRAM → HBM/SSD</text>
  </g>
  <g class="ph-hot" data-part="opt-factory">
    <path class="ph-ln" d="M615 76L615 60 652 76 652 60 689 76 689 60 726 76 726 60 763 76" fill="none"/><rect class="ph-fill ph-ln" x="615" y="76" width="150" height="62"/>
    <rect class="ph-chipf" x="632" y="98" width="22" height="16"/><polygon class="ph-fill ph-ln2" points="664,114 676,114 673,98 667,98"/><path class="ph-lead" d="M656 106h6M678 106h30"/><path class="ph-ln2" d="M708 102l8 4-8 4z"/><rect class="ph-metal" x="720" y="98" width="26" height="16"/>
    <g class="ph-plus"><circle cx="751" cy="90" r="9"/><path d="M751 86v8M747 90h8"/></g><text class="ph-lbl" x="690" y="156" text-anchor="middle">光模块制造链</text><text class="ph-lbls" x="690" y="170" text-anchor="middle">InP/硅光 → 1.6T · CPO/OCS</text>
  </g>
  <g class="ph-hot" data-part="fiber-factory">
    <path class="ph-ln" d="M805 76L805 60 842 76 842 60 879 76 879 60 916 76 916 60 953 76" fill="none"/><rect class="ph-fill ph-ln" x="805" y="76" width="150" height="62"/>
    <circle class="ph-ln" cx="860" cy="106" r="17"/><circle class="ph-ln2" cx="860" cy="106" r="10"/><circle class="ph-ln2" cx="860" cy="106" r="3.5"/><path class="ph-ln2" d="M877 106c23 0 31 8 59 8"/>
