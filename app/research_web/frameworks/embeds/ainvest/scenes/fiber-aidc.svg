<svg viewBox="0 0 1000 580" xmlns="http://www.w3.org/2000/svg" class="ph-scene">
  <text class="ph-lbls" x="45" y="42">AIDC 光纤部署：机柜端由 OSFP/MPO 进入高密度配线，园区内跨机柜互联与跨园区 DCI 分别采用不同距离和纤芯方案</text>
  <g class="ph-hot" data-part="aidc-gpu-rack"><rect class="ph-fill ph-ln" x="70" y="148" width="156" height="210" rx="6"/><path class="ph-ln2" d="M90 182h116M90 220h116M90 258h116M90 296h116"/><rect class="ph-chipf" x="164" y="164" width="28" height="18"/><rect class="ph-chipf" x="164" y="202" width="28" height="18"/><text class="ph-lbl" x="148" y="392" text-anchor="middle">GPU 机柜</text><text class="ph-lbls" x="148" y="409" text-anchor="middle">网卡 / OSFP 端口</text></g>
  <g class="ph-hot" data-part="aidc-mpo-panel"><rect class="ph-metal ph-ln" x="328" y="190" width="142" height="112" rx="5"/><circle class="ph-ln2" cx="356" cy="218" r="7" fill="none"/><circle class="ph-ln2" cx="384" cy="218" r="7" fill="none"/><circle class="ph-ln2" cx="412" cy="218" r="7" fill="none"/><circle class="ph-ln2" cx="440" cy="218" r="7" fill="none"/><path class="ph-ln2" d="M348 250h104M348 270h104"/><text class="ph-lbl" x="399" y="336" text-anchor="middle">MPO/MTP 配线</text><text class="ph-lbls" x="399" y="353" text-anchor="middle">预端接 / 高密度布线</text></g>
  <g class="ph-hot" data-part="aidc-spine-fiber"><rect class="ph-fill ph-ln" x="582" y="148" width="156" height="210" rx="6"/><path class="ph-ln2" d="M604 182h112M604 220h112M604 258h112M604 296h112"/><text class="ph-lbl" x="660" y="392" text-anchor="middle">Spine / Leaf</text><text class="ph-lbls" x="660" y="409" text-anchor="middle">柜间 Scale-out 网络</text></g>
  <path class="ph-flow" d="M226 245H328M470 245H582"/><text class="ph-lbls" x="510" y="220" text-anchor="middle">并行光纤 / 多芯连接</text>
  <g class="ph-hot" data-part="aidc-dci"><rect class="ph-fill ph-ln" x="804" y="192" width="126" height="106" rx="5"/><path class="ph-ln2" d="M824 218h86M824 242h86M824 266h86"/><text class="ph-lbl" x="867" y="332" text-anchor="middle">DCI / 园区互联</text><text class="ph-lbls" x="867" y="349" text-anchor="middle">相干模块 / 长距光纤</text></g>
  <path class="ph-dash" d="M738 245H804"/>
  <g class="ph-hot" data-part="aidc-fiber-choice"><rect class="ph-chipbg ph-ln" x="112" y="476" width="216" height="52" rx="4"/><text class="ph-lbl" x="220" y="498" text-anchor="middle">短距：多模 / AOC / 高密度 MPO</text><rect class="ph-chipbg ph-ln" x="392" y="476" width="216" height="52" rx="4"/><text class="ph-lbl" x="500" y="498" text-anchor="middle">中距：单模并行光纤</text><rect class="ph-chipbg ph-ln" x="672" y="476" width="216" height="52" rx="4"/><text class="ph-lbl" x="780" y="498" text-anchor="middle">长距：G.654E / HCF + DCI</text></g>
  <text class="ph-lbls" x="500" y="566" text-anchor="middle">不同距离、端口速率、机房布线密度和可维护性共同决定连接器、模块与光纤路线；图中为逻辑分工示意。</text>
</svg>
