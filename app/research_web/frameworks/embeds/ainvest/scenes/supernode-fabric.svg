<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" class="ph-scene">
  <text class="ph-lbls" x="45" y="42">国产算力超节点：计算、Scale-Up 交换、互连、供电液冷与集群软件构成一台逻辑计算机</text>
  <g class="ph-hot" data-part="super-compute"><rect class="ph-fill ph-ln" x="60" y="115" width="300" height="250" rx="6"/><text class="ph-lbl" x="210" y="145" text-anchor="middle">计算节点池</text><g class="ph-chipf"><rect x="92" y="170" width="55" height="44"/><rect x="166" y="170" width="55" height="44"/><rect x="240" y="170" width="55" height="44"/><rect x="92" y="242" width="55" height="44"/><rect x="166" y="242" width="55" height="44"/><rect x="240" y="242" width="55" height="44"/></g><path class="ph-lead" d="M120 214v28m74-28v28m74-28v28M120 286v32m74-32v32m74-32v32"/><text class="ph-lbls" x="210" y="332" text-anchor="middle">昇腾 / 寒武纪 / 海光等国产算力</text><text class="ph-lbls" x="210" y="348" text-anchor="middle">NPU/GPU + HBM · 多节点并行</text></g>
  <g class="ph-hot" data-part="super-switch"><rect class="ph-chipf ph-ln" x="430" y="162" width="140" height="150" rx="6"/><path class="ph-ln2" d="M458 198h84m-84 26h84m-84 26h84m-84 26h84"/><text class="ph-die" x="500" y="284" text-anchor="middle">Scale-Up 交换</text></g>
  <path class="ph-flow" d="M360 216H422M360 266H422M578 238H646"/><polygon points="422,211 434,216 422,221" fill="var(--accent)"/><polygon points="422,261 434,266 422,271" fill="var(--accent)"/><polygon points="646,233 658,238 646,243" fill="var(--accent)"/>
  <g class="ph-hot" data-part="super-backplane"><rect class="ph-fill ph-ln" x="670" y="115" width="265" height="150" rx="6"/><path class="ph-ln2" d="M700 152h205m-205 24h205m-205 24h205m-205 24h205"/><path class="ph-pipe-r" d="M724 152v72m44-72v72m44-72v72m44-72v72m44-72v72"/><text class="ph-lbl" x="802" y="298" text-anchor="middle">高速背板 / 线缆 / 光互连</text><text class="ph-lbls" x="802" y="314" text-anchor="middle">SerDes · 信号完整性 · 低时延</text></g>
  <g class="ph-hot" data-part="super-cooling"><rect class="ph-fill ph-ln" x="60" y="410" width="390" height="86" rx="6"/><path class="ph-pipe-r" d="M90 452h210m0 0h30m0 0h80"/><path class="ph-pipe-s" d="M116 432v40m70-40v40m70-40v40m70-40v40"/><text class="ph-lbl" x="255" y="436" text-anchor="middle">高密度供电与液冷回路</text><text class="ph-lbls" x="255" y="476" text-anchor="middle">直流母排 · CDU · 冷板 · 快接头</text></g>
  <g class="ph-hot" data-part="super-software"><rect class="ph-fill ph-ln" x="550" y="390" width="385" height="106" rx="6"/><rect class="ph-chipbg ph-ln2" x="582" y="420" width="94" height="40"/><rect class="ph-chipbg ph-ln2" x="702" y="420" width="94" height="40"/><rect class="ph-chipbg ph-ln2" x="822" y="420" width="74" height="40"/><text class="ph-lbl" x="742" y="438" text-anchor="middle">统一资源池 / 集群软件</text><text class="ph-lbls" x="742" y="478" text-anchor="middle">拓扑调度 · 集体通信 · 编译器 · 容错与运维</text></g>
  <path class="ph-dash" d="M500 330V382"/><text class="ph-lbls" x="500" y="536" text-anchor="middle">Scale-Up 解决近端高频卡间通信，Scale-Out 扩展到更多机柜；结构为可读性简化，非特定厂商工程图。</text>
</svg>
