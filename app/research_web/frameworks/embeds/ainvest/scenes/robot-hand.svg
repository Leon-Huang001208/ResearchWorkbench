<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" class="ph-scene">
  <text class="ph-lbls" x="45" y="40">灵巧手通过驱动、传动和触觉/力反馈，把“到达物体”变成“稳定而柔顺地操作物体”</text>
  <g class="ph-hot" data-part="hand-drive-detail"><rect class="ph-fill ph-ln" x="66" y="180" width="186" height="120" rx="8"/><circle class="ph-ln" cx="130" cy="240" r="32"/><circle class="ph-ln2" cx="130" cy="240" r="12"/><path class="ph-ln2" d="M162 240h58"/><text class="ph-lbl" x="159" y="334" text-anchor="middle">微型驱动单元</text><text class="ph-lbls" x="159" y="351" text-anchor="middle">电机/减速器/驱动板</text></g>
  <g class="ph-hot" data-part="hand-transmission-detail"><rect class="ph-fill ph-ln" x="330" y="150" width="260" height="180" rx="8"/><path class="ph-ln" d="M390 288v-98M438 288v-118M486 288v-98M534 288v-78"/><circle class="ph-fill ph-ln2" cx="390" cy="190" r="8"/><circle class="ph-fill ph-ln2" cx="438" cy="170" r="8"/><circle class="ph-fill ph-ln2" cx="486" cy="190" r="8"/><circle class="ph-fill ph-ln2" cx="534" cy="210" r="8"/><path class="ph-flow" d="M354 270H560"/><text class="ph-lbl" x="460" y="364" text-anchor="middle">腱绳 / 连杆 / 直驱传动</text><text class="ph-lbls" x="460" y="381" text-anchor="middle">将驱动分配到多指关节</text></g>
  <g class="ph-hot" data-part="hand-tactile-detail"><rect class="ph-chipbg ph-ln" x="672" y="176" width="128" height="128" rx="8"/><path class="ph-ln2" d="M704 208h64M704 232h64M704 256h64M720 192v96M744 192v96"/><circle class="ph-chipf" cx="732" cy="220" r="5"/><circle class="ph-chipf" cx="756" cy="244" r="5"/><text class="ph-lbl" x="736" y="338" text-anchor="middle">触觉阵列</text><text class="ph-lbls" x="736" y="355" text-anchor="middle">压力/滑移/接触位置</text></g>
  <g class="ph-hot" data-part="hand-force-detail"><rect class="ph-fill ph-ln" x="850" y="190" width="92" height="100" rx="8"/><circle class="ph-ln" cx="896" cy="238" r="24"/><path class="ph-ln2" d="M896 214v48M872 238h48"/><text class="ph-lbl" x="896" y="324" text-anchor="middle">力控</text><text class="ph-lbls" x="896" y="341" text-anchor="middle">柔顺抓取</text></g>
  <path class="ph-flow" d="M252 240H320M590 240H662M800 240H840"/><polygon points="320,235 330,240 320,245" fill="var(--accent)"/><polygon points="662,235 672,240 662,245" fill="var(--accent)"/><polygon points="840,235 850,240 840,245" fill="var(--accent)"/>
  <path class="ph-dash" d="M896 374C896 452 200 452 158 342"/><text class="ph-lbls" x="520" y="442" text-anchor="middle">触觉/力反馈 → 控制器 → 驱动调节，使手部能够随物体状态动态调整力度与姿态</text>
</svg>
