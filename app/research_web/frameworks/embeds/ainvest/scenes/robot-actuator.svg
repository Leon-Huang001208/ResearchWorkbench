<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" class="ph-scene">
  <text class="ph-lbls" x="45" y="40">关节执行器把电能转为可控扭矩或直线力：旋转关节偏向电机+减速器，线性关节偏向电机+丝杠</text>
  <g class="ph-hot" data-part="actuator-motor"><rect class="ph-fill ph-ln" x="78" y="170" width="150" height="120" rx="8"/><circle class="ph-ln" cx="153" cy="230" r="38"/><circle class="ph-ln2" cx="153" cy="230" r="14"/><path class="ph-ln2" d="M115 230h76M153 192v76"/><text class="ph-lbl" x="153" y="324" text-anchor="middle">无框力矩电机</text><text class="ph-lbls" x="153" y="341" text-anchor="middle">定子/转子嵌入关节</text></g>
  <g class="ph-hot" data-part="actuator-harmonic"><rect class="ph-fill ph-ln" x="330" y="170" width="170" height="120" rx="8"/><circle class="ph-ln" cx="415" cy="230" r="40"/><ellipse class="ph-ln2" cx="415" cy="230" rx="26" ry="33"/><circle class="ph-chipf" cx="415" cy="230" r="12"/><path class="ph-ln2" d="M375 230h80M415 190v80"/><text class="ph-lbl" x="415" y="324" text-anchor="middle">谐波减速器</text><text class="ph-lbls" x="415" y="341" text-anchor="middle">波发生器 · 柔轮 · 刚轮</text></g>
  <g class="ph-hot" data-part="actuator-rv"><rect class="ph-fill ph-ln" x="590" y="170" width="150" height="120" rx="8"/><circle class="ph-ln" cx="665" cy="230" r="40"/><circle class="ph-ln2" cx="665" cy="230" r="24"/><circle class="ph-chipf" cx="665" cy="230" r="9"/><path class="ph-ln2" d="M641 206l48 48M689 206l-48 48"/><text class="ph-lbl" x="665" y="324" text-anchor="middle">RV 减速器</text><text class="ph-lbls" x="665" y="341" text-anchor="middle">摆线针轮 · 高承载</text></g>
  <g class="ph-hot" data-part="actuator-screw"><rect class="ph-fill ph-ln" x="804" y="170" width="132" height="120" rx="8"/><path class="ph-ln" d="M824 230h92"/><path class="ph-ln2" d="M834 218l10 24 10-24 10 24 10-24 10 24 10-24"/><rect class="ph-chipf" x="850" y="204" width="36" height="52"/><text class="ph-lbl" x="870" y="324" text-anchor="middle">丝杠</text><text class="ph-lbls" x="870" y="341" text-anchor="middle">旋转 → 直线力</text></g>
  <path class="ph-flow" d="M228 230H320M500 230H580M740 230H794"/><polygon points="320,225 330,230 320,235" fill="var(--accent)"/><polygon points="580,225 590,230 580,235" fill="var(--accent)"/><polygon points="794,225 804,230 794,235" fill="var(--accent)"/>
  <g class="ph-hot" data-part="actuator-encoder"><rect class="ph-chipbg ph-ln" x="398" y="402" width="204" height="76" rx="7"/><path class="ph-ln2" d="M424 430h52M424 450h52M500 422v42M524 430h52M524 450h52"/><text class="ph-lbl" x="500" y="510" text-anchor="middle">编码器 + 驱动器 · 位置/速度/电流闭环</text></g>
  <path class="ph-dash" d="M870 290C820 420 650 438 608 438"/><text class="ph-lbls" x="760" y="396">反馈 → 精确运动控制</text>
</svg>
