<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" class="ph-scene">
  <text class="ph-lbls" x="45" y="40">机器人感知与控制是“看见—理解—估计—执行”的实时闭环：模型给策略，端侧系统把它变成安全动作</text>
  <g class="ph-hot" data-part="sense-vision"><rect class="ph-fill ph-ln" x="62" y="164" width="196" height="130" rx="8"/><rect class="ph-chipbg ph-ln2" x="90" y="190" width="140" height="70"/><circle class="ph-ln2" cx="126" cy="224" r="14"/><path class="ph-ln2" d="M152 246l24-30 28 30"/><text class="ph-lbl" x="160" y="328" text-anchor="middle">3D 视觉</text><text class="ph-lbls" x="160" y="345" text-anchor="middle">RGB/深度/双目 · 场景与目标</text></g>
  <g class="ph-hot" data-part="sense-force"><rect class="ph-fill ph-ln" x="330" y="164" width="176" height="130" rx="8"/><circle class="ph-ln" cx="418" cy="222" r="34"/><path class="ph-ln2" d="M418 188v68M384 222h68M394 198l48 48M442 198l-48 48"/><text class="ph-lbl" x="418" y="328" text-anchor="middle">力/力矩与触觉</text><text class="ph-lbls" x="418" y="345" text-anchor="middle">接触、载荷、滑移</text></g>
  <g class="ph-hot" data-part="sense-state"><rect class="ph-fill ph-ln" x="578" y="164" width="176" height="130" rx="8"/><circle class="ph-chipf" cx="640" cy="222" r="25"/><path class="ph-ln2" d="M640 197v50M615 222h50"/><path class="ph-ln2" d="M690 202h36M690 222h36M690 242h36"/><text class="ph-lbl" x="666" y="328" text-anchor="middle">IMU / 编码器</text><text class="ph-lbls" x="666" y="345" text-anchor="middle">姿态、速度、关节角</text></g>
  <g class="ph-hot" data-part="sense-controller"><rect class="ph-chipf" x="826" y="142" width="124" height="174" rx="8"/><path class="ph-ln2" d="M850 180h76M850 204h76M850 228h76M850 252h76"/><text class="ph-die" x="888" y="282" text-anchor="middle">端侧控制器</text><text class="ph-lbls" x="888" y="348" text-anchor="middle">状态估计 · 规划 · 闭环</text></g>
  <path class="ph-flow" d="M258 229H320M506 229H568M754 229H816"/><polygon points="320,224 330,229 320,234" fill="var(--accent)"/><polygon points="568,224 578,229 568,234" fill="var(--accent)"/><polygon points="816,224 826,229 816,234" fill="var(--accent)"/>
  <path class="ph-dash" d="M888 392C888 486 120 486 160 362"/><polygon points="157,368 160,354 170,362" fill="var(--txt3)"/><text class="ph-lbls" x="520" y="474" text-anchor="middle">控制器把传感融合为机器人状态，再执行模型策略并下发关节目标；安全与低时延由端侧闭环保障。</text>
</svg>
