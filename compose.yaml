{
  "services": {
    "research-web": {
      "build": { "context": ".", "dockerfile": "Dockerfile" },
      "image": "${RWB_IMAGE:-research-workbench:local}",
      "init": false,
      "user": "10001:10001",
      "read_only": true,
      "cap_drop": ["ALL"],
      "security_opt": ["no-new-privileges:true"],
      "stop_grace_period": "35s",
      "ports": ["127.0.0.1:${RWB_WEB_PORT:-8088}:8088"],
      "environment": {
        "RWB_DATA_ROOT": "/data/research-web",
        "RWB_RUNTIME_STATE": "/state/runtime",
        "RESEARCH_CREDENTIAL_HOME": "/run/rwb-secrets/private",
        "LOG_DIR": "/state/logs"
      },
      "volumes": [
        { "type": "bind", "source": "${RWB_DATA_DIR:?Set RWB_DATA_DIR}", "target": "/data/research-web", "bind": { "create_host_path": false } },
        { "type": "bind", "source": "${RWB_STATE_DIR:?Set RWB_STATE_DIR}/logs", "target": "/state/logs", "bind": { "create_host_path": false } },
        { "type": "bind", "source": "${RWB_CREDENTIAL_DIR:?Set RWB_CREDENTIAL_DIR}", "target": "/run/rwb-secrets", "bind": { "create_host_path": false } }
      ],
      "tmpfs": ["/tmp:rw,nosuid,nodev,mode=1777", "/home/rwb:rw,nosuid,nodev,uid=10001,gid=10001,mode=700", "/state:rw,nosuid,nodev,noexec,uid=10001,gid=10001,mode=700,size=1m"],
      "labels": {
        "io.research-workbench.runtime": "docker",
        "io.research-workbench.installation": "${RWB_INSTALLATION_ID:?Set RWB_INSTALLATION_ID}"
      },
      "logging": { "driver": "json-file", "options": { "max-size": "10m", "max-file": "3" } }
    }
  }
}
