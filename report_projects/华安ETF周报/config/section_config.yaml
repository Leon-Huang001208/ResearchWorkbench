name: 华安ETF周报
version: '1.0'
description: 华安ETF周报 Word 占位符与内置 Query Prompt 模板映射
assets:
  word_template: report_template.docx
  excel_workbook: 周报数据.xlsx
  chart_workbook: 周报图表.xlsx
  prompt_templates: prompt_templates.md
defaults:
  generation_mode: evidence_grounded_generation
  evidence_policy: strict
  query_mode: retrieval_query_embedded
  validators:
    require_evidence_from_uploaded_material: true
    forbid_external_facts: true
    forbid_direct_investment_advice: true
    forbidden_terms:
      - 保本
      - 稳赚
      - 收益保证
      - 明确买入
      - 目标价
  generation_constraints:
  - 严格依据evidence 和写作参数生成内容，不得补充外部知识或虚构信息
  - 所有事实、数据、观点和结论均须有明确依据；依据不足时仅陈述事实
  - 使用数值时必须说明来源；Excel 数据可直接引用
  - 不得编造任何数据、来源或观点
  - 不得输出投资建议、收益承诺、目标价、仓位建议或交易指令
  - 禁止出现：保本、稳赚、收益保证、明确买入、明确卖出、目标价
  - 禁止出现：根据文件、据报道、数据显示
  - 除明确要求外，不得新增任何实体名称
  - 仅输出单段正文，不输出标题、列表或解释
  report_period:
    report_date: 2026-06-26
    start_date: 2026-06-20
    end_date: 2026-06-26
  retrieval:
    mode: hybrid
    top_k: 10
    candidate_k: 40
    semantic_candidate_k: 80
    keyword_weight: 0.6
    semantic_weight: 0.4
    embedding_model: /Users/leon/Desktop/Projects/AlphaFoundry/data/models/embeddings/bge-large-zh-v1.5
  rerank:
    enabled: true
    provider: bge-reranker
    model: /Users/leon/Desktop/Projects/AlphaFoundry/data/models/rerankers/bge-reranker-large
    top_n: 30
    min_score: 0.35
charts:
  industry_weekly_performance:
    title: 申万一级行业周涨跌幅
    enabled: true
    workbook: 周报图表.xlsx
    source_chart: xl/charts/chart1.xml
    native_chart_part: word/charts/chart1.xml
    type: column_bar
    show_title: false
    skip_if_all_zero: true
    fallback:
      package: word_template
      source_chart: word/charts/chart1.xml
    replace:
      kind: native_chart
  gold_price:
    title: 黄金价格走势
    enabled: true
    workbook: 周报图表.xlsx
    source_chart: xl/charts/chart2.xml
    native_chart_part: word/charts/chart2.xml
    source_data:
      kind: worksheet
      sheet: 伦敦金_Au9999
      start_row: 3
      category_column: A
      series:
      - name: 伦敦金(美元/盎司)
        column: B
      - name: 黄金Au9999(右, 元/克)
        column: C
    type: dual_axis_line
    show_title: false
    date_format: '%Y'
    date_ticks: year
    x_label_rotation: 0
    y_limits:
    - 1000
    - 6000
    secondary_y_limits:
    - 200
    - 1400
    replace:
      kind: native_chart
  crude_oil_price:
    title: Brent vs WTI 原油期货结算价
    enabled: true
    workbook: 周报图表.xlsx
    source_chart: xl/charts/chart3.xml
    native_chart_part: word/charts/chart3.xml
    source_data:
      kind: worksheet
      sheet: 期货结算价(连续)_布伦特原油
      start_row: 3
      category_column: A
      series:
      - name: 布伦特原油
        column: B
      - name: WTI原油
        column: C
    type: line
    show_title: true
    date_format: '%Y'
    date_ticks: year
    x_label_rotation: 45
    y_limits:
    - 0
    - 140
    colors:
    - '#2F5597'
    - '#8FAADC'
    replace:
      kind: native_chart
tables:
  global_investment_calendar:
    title: 下周全球投资日历
    enabled: true
    placeholder: 下周全球投资日历
    workbook: 全球经济日历.xlsx
    sheet: 经济数据
    columns:
    - 日期
    - 国家/地区
    - 指标名称
    filter:
      column: 重要性
      equals: 重要
placeholders:
  A股市场回顾:
    title: A股市场回顾
    type: composite_market_review
    prompt_template: A股市场回顾
    query_mode: retrieval_query_embedded
    target_words: 200
    max_words: 200
    min_news_count: 5
    data_source:
      workbook: 周报数据.xlsx
      domestic_sheet: 国内
      turnover_sheet: 市场成交
    components:
    - name: 市场表现与交易面
      type: data_template
      source: excel
      template: 本周A股市场整体呈现{market_trend}，主要指数表现不一：{index_performance}。交易面，A股市场本周日均成交额在{avg_turnover}左右，市场投资热情{turnover_trend}。
      fields:
        market_trend:
          label: market_trend
          workbook: 周报数据.xlsx
          sheet: 国内
          range: B2:C6
          rule: 读取主要指数周内涨跌幅，正负都有为“分化趋势”，全涨为“普涨趋势”，全跌为“调整趋势”
        index_performance:
          label: index_performance
          workbook: 周报数据.xlsx
          sheet: 国内
          range: B2:C6
          rule: 按顺序读取指数名称和周内涨跌幅，生成“沪深300涨0.86%”这类列表
        avg_turnover:
          label: avg_turnover
          workbook: 周报数据.xlsx
          sheet: 市场成交
          cell: B2
          rule: 读取本周日均成交额，并格式化为“x.xx万亿”
        turnover_trend:
          label: turnover_trend
          workbook: 周报数据.xlsx
          sheet: 市场成交
          range: B2:C2
          rule: 比较本周日均成交额和上周日均成交额，生成“回升/回落/持平”
    - name: 市场热点与趋势判断
      type: llm_writing
      retrieval:
        keyword_profile: A股市场回顾
      writing_structure:
      - 接在固定开头之后，概括本周市场热点板块或概念，按材料中的重要性或出现频率排序
      - 描述板块轮动特征，包括反复活跃方向、阶段性活跃方向和相对低迷方向
      - 结合一个有明确 evidence 支撑的政策、产业或景气度变化，给出一句审慎趋势判断
      - 最后如需表达关注方向，应使用“后续可关注”“值得跟踪”等克制表述，不得构成直接投资建议
    params: {}
  开始日期:
    title: 开始日期
    type: report_period
