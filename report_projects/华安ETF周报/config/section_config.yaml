name: 华安ETF周报
version: '1.0'
description: 华安ETF周报 Word 占位符与内置 Query Prompt 模板映射
assets:
  word_template: report_template.docx
  excel_workbook: 周报数据.xlsx
  chart_workbook: 周报图表.xlsx
  prompt_templates: prompt_templates.md
defaults:
  generation_mode: evidence_grounded_generation
  evidence_policy: strict
  query_mode: retrieval_query_embedded
  validators:
    require_evidence_from_uploaded_material: true
    forbid_external_facts: true
    forbid_direct_investment_advice: true
    forbidden_terms:
    - 保本
    - 稳赚
    - 收益保证
    - 明确买入
    - 目标价
    forbid_wind_data: true
    forbid_daily_data: true
    require_source_for_numbers: true
    no_newline: true
    forbidden_phrases:
    - 根据文件
    - 据报道
    - 数据显示
    forbid_entities:
    - 指数名称
    - 公司名称
    - 证券机构
    - 个股名称
    - ETF名称
  retrieval:
    mode: hybrid
    top_k: 8
    candidate_k: 50
    semantic_candidate_k: 100
    min_keyword_score: 1
    fusion:
      method: rrf
      keyword_weight: 0.65
      semantic_weight: 0.35
      rrf_k: 60
    rerank:
      enabled: true
      provider: llm
      top_n: 16
      min_score: 30
charts:
  industry_weekly_performance:
    title: 申万一级行业周涨跌幅
    enabled: true
    workbook: 周报图表.xlsx
    source_chart: xl/charts/chart1.xml
    native_chart_part: word/charts/chart1.xml
    type: column_bar
    show_title: false
    skip_if_all_zero: true
    fallback:
      package: word_template
      source_chart: word/charts/chart1.xml
    replace:
      kind: native_chart
  gold_price:
    title: 黄金价格走势
    enabled: true
    workbook: 周报图表.xlsx
    source_chart: xl/charts/chart2.xml
    native_chart_part: word/charts/chart2.xml
    source_data:
      kind: worksheet
      sheet: 伦敦金_Au9999
      start_row: 3
      category_column: A
      series:
      - name: 伦敦金(美元/盎司)
        column: B
      - name: 黄金Au9999(右, 元/克)
        column: C
    type: dual_axis_line
    show_title: false
    date_format: '%Y'
    date_ticks: year
    x_label_rotation: 0
    y_limits:
    - 1000
    - 6000
    secondary_y_limits:
    - 200
    - 1400
    replace:
      kind: native_chart
  crude_oil_price:
    title: Brent vs WTI 原油期货结算价
    enabled: true
    workbook: 周报图表.xlsx
    source_chart: xl/charts/chart3.xml
    native_chart_part: word/charts/chart3.xml
    source_data:
      kind: worksheet
      sheet: 期货结算价(连续)_布伦特原油
      start_row: 3
      category_column: A
      series:
      - name: 布伦特原油
        column: B
      - name: WTI原油
        column: C
    type: line
    show_title: true
    date_format: '%Y'
    date_ticks: year
    x_label_rotation: 45
    y_limits:
    - 0
    - 140
    colors:
    - '#2F5597'
    - '#8FAADC'
    replace:
      kind: native_chart
tables:
  global_investment_calendar:
    title: 下周全球投资日历
    enabled: true
    placeholder: 下周全球投资日历
    workbook: 全球经济日历.xlsx
    sheet: 经济数据
    columns:
    - 日期
    - 国家/地区
    - 指标名称
    filter:
      column: 重要性
      equals: 重要
placeholders:
  开始日期:
