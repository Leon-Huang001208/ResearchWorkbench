name: 华安ETF周报
version: '1.0'
description: 华安ETF周报 Word 占位符与内置 Query Prompt 模板映射
assets:
  word_template: report_template.docx
  excel_workbook: 周报数据.xlsx
  chart_workbook: 周报图表.xlsx
  prompt_templates: prompt_templates.md
defaults:
  generation_mode: evidence_grounded_generation
  evidence_policy: strict
  query_mode: retrieval_query_embedded
  validators:
    require_evidence_from_uploaded_material: true
    forbid_external_facts: true
    forbid_direct_investment_advice: true
    forbid_parentheses: true
    forbidden_terms:
      - 保本
      - 稳赚
      - 收益保证
      - 明确买入
      - 目标价
  generation_constraints:
  - 严格依据evidence 和写作参数生成内容，不得补充外部知识或虚构信息
  - 所有事实、数据、观点和结论均须有明确依据；依据不足时仅陈述事实
  - 所有来源仅用于内部事实核验，正文不得输出来源名称、Evidence 编号、引用编号、脚注或来源括号
  - 正文不得出现“（某某研报）”“（财联社，日期）”“（引用[n]）”“（evidence n）”等引用标记
  - 直接将事实自然融入正文，不使用括号补充出处
  - 不得编造任何数据、来源或观点
  - 不得输出投资建议、收益承诺、目标价、仓位建议或交易指令
  - 禁止出现：保本、稳赚、收益保证、明确买入、明确卖出、目标价
  - 禁止出现：根据文件、据报道、数据显示
  - 除明确要求外，不得新增任何实体名称
  - 仅输出单段正文，不输出标题、列表或解释
  - 核心分析仅使用报告期内已发生的事实，未来安排只可作为后续关注变量
  - 正文不使用括号补充说明
  report_period:
    mode: current_week
    lookback_days: 7
  retrieval:
    mode: hybrid
    top_k: 10
    candidate_k: 40
    relevance_scan_limit: 400
    semantic_candidate_k: 80
    keyword_weight: 0.6
    semantic_weight: 0.4
    embedding_model: data/models/embeddings/bge-large-zh-v1.5
    exclude_title_keywords:
    - 下周
    - 即将
    - 将于
    - 明日
  rerank:
    enabled: true
    provider: bge-reranker
    model: data/models/rerankers/bge-reranker-large
    top_n: 30
    min_score: 0.35
charts:
  industry_weekly_performance:
    title: 申万一级行业周涨跌幅
    enabled: true
    workbook: 周报图表.xlsx
    source_chart: xl/charts/chart1.xml
    native_chart_part: word/charts/chart1.xml
    type: column_bar
    show_title: false
    skip_if_all_zero: true
    fallback:
      package: word_template
      source_chart: word/charts/chart1.xml
    replace:
      kind: native_chart
  gold_price:
    title: 黄金价格走势
    enabled: true
    workbook: 周报图表.xlsx
    source_chart: xl/charts/chart2.xml
    native_chart_part: word/charts/chart2.xml
    source_data:
      kind: worksheet
      sheet: 伦敦金_Au9999
      start_row: 3
      category_column: A
      series:
      - name: 伦敦金(美元/盎司)
        column: B
      - name: 黄金Au9999(右, 元/克)
        column: C
    type: dual_axis_line
    show_title: false
    date_format: '%Y'
    date_ticks: year
    x_label_rotation: 0
    y_limits:
    - 1000
    - 6000
    secondary_y_limits:
    - 200
    - 1400
    replace:
      kind: native_chart
  crude_oil_price:
    title: Brent vs WTI 原油期货结算价
    enabled: true
    workbook: 周报图表.xlsx
    source_chart: xl/charts/chart3.xml
    native_chart_part: word/charts/chart3.xml
    source_data:
      kind: worksheet
      sheet: 期货结算价(连续)_布伦特原油
      start_row: 3
      category_column: A
      series:
      - name: 布伦特原油
        column: B
      - name: WTI原油
        column: C
    type: line
    show_title: true
    date_format: '%Y'
    date_ticks: year
    x_label_rotation: 45
    y_limits:
    - 0
    - 140
    colors:
    - '#2F5597'
    - '#8FAADC'
    replace:
      kind: native_chart
tables:
  global_investment_calendar:
    title: 下周全球投资日历
    enabled: true
    placeholder: 下周全球投资日历
    workbook: 全球经济日历.xlsx
    sheet: 经济数据
    columns:
    - 日期
    - 国家/地区
    - 指标名称
    filter:
      column: 重要性
      equals: 重要
placeholders:
  A股市场回顾:
    title: A股市场回顾
    type: paragraph
    confirmed: true
    mode: data_template_plus_evidence_ai
    prompt_template: A股市场回顾
    query_mode: retrieval_query_embedded
    target_words: 220
    max_words: 260
    min_news_count: 5
    data_source:
      workbook: 周报数据.xlsx
      domestic_sheet: 国内
      turnover_sheet: 市场成交
    components:
    - name: 市场表现与交易面
      type: data_template
      source: excel
      template: 本周A股市场整体呈现{market_trend}，主要指数表现不一：{index_performance}。交易面，A股市场本周日均成交额在{avg_turnover}左右，市场投资热情{turnover_trend}。
      fields:
        market_trend:
          label: market_trend
          display_name: 市场走势
          workbook: 周报数据.xlsx
          sheet: 国内
          range: B2:C6
          rule: 读取主要指数周内涨跌幅，正负都有为“分化趋势”，全涨为“普涨趋势”，全跌为“调整趋势”
        index_performance:
          label: index_performance
          display_name: 指数表现
          workbook: 周报数据.xlsx
          sheet: 国内
          range: B2:C6
          rule: 按顺序读取指数名称和周内涨跌幅，生成“沪深300涨0.86%”这类列表
        avg_turnover:
          label: avg_turnover
          display_name: 日均成交
          workbook: 周报数据.xlsx
          sheet: 市场成交
          cell: B2
          rule: 读取本周日均成交额，并格式化为“x.xx万亿”
        turnover_trend:
          label: turnover_trend
          display_name: 成交热度
          workbook: 周报数据.xlsx
          sheet: 市场成交
          range: B2:C2
          rule: 比较本周日均成交额和上周日均成交额，生成“回升/回落/持平”
    - name: 市场热点与趋势判断
      type: llm_writing
      retrieval:
        keyword_profile: A股市场回顾
        subject_keywords:
        - A股
        - 沪深股市
        - 中国股市
        keywords:
        - 板块轮动
        - 市场热点
        - 资金
        - 政策
        - 景气度
        - 风险偏好
      writing_structure:
      - 接在固定开头之后，概括本周最重要的市场热点和板块轮动，不得写成新闻清单
      - 选择一个有充分 Evidence 支撑的政策、产业、资金或景气变化作为核心驱动
      - 说明核心驱动如何影响风险偏好和板块表现，不重复前文指数和成交额数字
      - 末句给出审慎趋势判断和后续观察变量，不构成投资建议
    params: {}
  开始日期:
    title: 开始日期
    type: field
    format: date
    source:
      kind: report_period
      field: start_date
  结束日期:
    title: 结束日期
    type: field
    format: date
    source:
      kind: report_period
      field: end_date
  中国宏观:
    title: 中国宏观
    type: paragraph
    confirmed: true
    mode: evidence_ai
    prompt_template: 中国宏观
    query_mode: retrieval_query_embedded
    target_words: 300
    max_words: 300
    min_news_count: 6
    retrieval:
      keyword_profile: 中国
      subject_keywords:
      - 中国经济
      - 国内宏观
      - 中国宏观
      - 中国人民银行
      - 国家统计局
      - 中国PMI
      - 中国社融
      keywords:
      - PMI
      - CPI
      - PPI
      - 社会融资
      - 货币政策
      - 财政政策
      - 房地产
    writing_structure:
    - 首句判断本周中国宏观环境或政策取向的主要变化
    - 选择证据最充分且解释力最强的数据、政策决定或官员表态作为核心驱动
    - 说明核心驱动如何传导至增长、通胀、利率、汇率或风险偏好，只写 Evidence 支撑的链条
    - 根据材料补充财政、产业或外部风险等次要因素；材料不足时不强行覆盖
    - 末句总结当前阶段，并列出后续最值得关注的二至四项变量
    params: {}
