      - 财政政策
      - 房地产
    writing_structure:
    - 首句判断本周中国宏观环境或政策取向的主要变化
    - 选择证据最充分且解释力最强的数据、政策决定或官员表态作为核心驱动
    - 说明核心驱动如何传导至增长、通胀、利率、汇率或风险偏好，只写 Evidence 支撑的链条
    - 根据材料补充财政、产业或外部风险等次要因素；材料不足时不强行覆盖
    - 末句总结当前阶段，并列出后续最值得关注的二至四项变量
