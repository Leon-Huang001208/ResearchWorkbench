name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag. Empty uses desktop-<run number>."
        required: false
        type: string
      release_name:
        description: "Release title. Empty uses AlphaFoundry Desktop <tag>."
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  desktop:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            os: macos-14
            triple: aarch64-apple-darwin
          - label: Windows x64
            os: windows-2022
            triple: x86_64-pc-windows-msvc

    env:
      TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      ALPHAFOUNDRY_UPDATER_ENDPOINT: ${{ vars.ALPHAFOUNDRY_UPDATER_ENDPOINT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release metadata on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            release_tag="${GITHUB_REF_NAME}"
          elif [[ -n "${{ inputs.tag }}" ]]; then
            release_tag="${{ inputs.tag }}"
          else
            release_tag="desktop-${GITHUB_RUN_NUMBER}"
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "${{ inputs.release_name }}" ]]; then
            release_name="${{ inputs.release_name }}"
          else
            release_name="AlphaFoundry Desktop ${release_tag}"
          fi

          echo "RELEASE_TAG=${release_tag}" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=${release_name}" >> "$GITHUB_ENV"

      - name: Resolve release metadata on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            $releaseTag = $env:GITHUB_REF_NAME
          } elseif ('${{ inputs.tag }}') {
            $releaseTag = '${{ inputs.tag }}'
          } else {
            $releaseTag = "desktop-$env:GITHUB_RUN_NUMBER"
          }

          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and '${{ inputs.release_name }}') {
            $releaseName = '${{ inputs.release_name }}'
          } else {
            $releaseName = "AlphaFoundry Desktop $releaseTag"
          }

          "RELEASE_TAG=$releaseTag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_NAME=$releaseName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Fetch Rust dependencies on macOS
        if: runner.os == 'macOS'
        shell: bash
        working-directory: src-tauri
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if cargo fetch --locked; then
              exit 0
            fi
            sleep "$((attempt * 20))"
          done
          cargo fetch --locked

      - name: Fetch Rust dependencies on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: src-tauri
        run: |
          $ErrorActionPreference = 'Stop'
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            cargo fetch --locked
            if ($LASTEXITCODE -eq 0) {
              exit 0
            }
            Start-Sleep -Seconds ($attempt * 20)
          }
          throw 'cargo fetch --locked failed after three attempts'

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e . pyinstaller

      - name: Install Python dependencies on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install -e . pyinstaller

      - name: Build backend sidecar
        run: python scripts/desktop/build_sidecar.py

      - name: Verify macOS sidecar
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          sidecar="build/desktop-sidecar/dist/alphafoundry-backend-${{ matrix.triple }}"
          if [[ ! -f "$sidecar" ]]; then
            echo "Expected sidecar was not produced: $sidecar" >&2
            exit 1
          fi

      - name: Verify Windows sidecar
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sidecar = "build/desktop-sidecar/dist/alphafoundry-backend-${{ matrix.triple }}.exe"
          if (-not (Test-Path -LiteralPath $sidecar -PathType Leaf)) {
            throw "Expected sidecar was not produced: $sidecar"
          }

      - name: Copy backend sidecar into Tauri
        run: python scripts/desktop/prepare_tauri_sidecar.py

      - name: Generate updater release config on macOS
        if: runner.os == 'macOS' && env.TAURI_UPDATER_PUBKEY != ''
        shell: bash
        run: |
          set -euo pipefail
          python scripts/desktop/write_tauri_release_config.py
          echo "TAURI_BUILD_ARGS=--config src-tauri/tauri.release.conf.json" >> "$GITHUB_ENV"

      - name: Generate updater release config on Windows
        if: runner.os == 'Windows' && env.TAURI_UPDATER_PUBKEY != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/desktop/write_tauri_release_config.py
          "TAURI_BUILD_ARGS=--config src-tauri/tauri.release.conf.json" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Disable updater artifacts without updater key on macOS
        if: runner.os == 'macOS' && env.TAURI_UPDATER_PUBKEY == ''
        shell: bash
        run: |
          set -euo pipefail
          echo "TAURI_BUILD_ARGS=" >> "$GITHUB_ENV"

      - name: Disable updater artifacts without updater key on Windows
        if: runner.os == 'Windows' && env.TAURI_UPDATER_PUBKEY == ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          "TAURI_BUILD_ARGS=" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build and upload Tauri bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ env.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: ${{ env.RELEASE_NAME }}
          releaseDraft: true
          prerelease: true
          args: ${{ env.TAURI_BUILD_ARGS }}
