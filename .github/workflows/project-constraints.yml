name: Project Constraints

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enforce project constraints
        shell: bash
        run: |
          set -euo pipefail
          arguments=(--project "$GITHUB_WORKSPACE")
          base=""
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            base="${{ github.event.before }}"
          fi
          if [[ -n "$base" ]]; then
            while IFS= read -r changed_file; do
              [[ -n "$changed_file" ]] && arguments+=(--changed-file "$changed_file")
            done < <(git diff --name-only "$base" "$GITHUB_SHA")
          fi
          node .agents/project-constraints.mjs "${arguments[@]}"
