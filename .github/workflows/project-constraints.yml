name: Project Constraints

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test portable Research Web architecture gate
        run: node --test tests/javascript/research_web_architecture.test.mjs

      - name: Enforce project constraints
        shell: bash
        run: |
          set -euo pipefail
          arguments=(--project "$GITHUB_WORKSPACE")
          base=""
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            base="${{ github.event.before }}"
          fi
          if [[ -n "$base" ]]; then
            changed_files=$(mktemp "$RUNNER_TEMP/project-constraints.XXXXXX")
            trap 'rm -f -- "$changed_files"' EXIT
            if ! git diff --name-only -z "$base" "$GITHUB_SHA" -- > "$changed_files"; then
              printf 'Project constraints: git diff failed; refusing incomplete change input.\n' >&2
              exit 1
            fi
            while IFS= read -r -d '' changed_file; do
              [[ -n "$changed_file" ]] && arguments+=(--changed-file "$changed_file")
            done < "$changed_files"
          fi
          node .agents/project-constraints.mjs "${arguments[@]}"
