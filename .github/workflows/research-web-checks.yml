name: Research Web Checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/research_web/**"
      - "app/cli/**"
      - "research_workbench_entrypoint/**"
      - "scripts/run_ci_pytest_partitions.py"
      - "scripts/stage_ci_pytest_evidence.py"
      - "tests/research_web/**"
      - "tests/unit/test_ci_pytest_partitions.py"
      - "tests/unit/test_ci_pytest_evidence_staging.py"
      - "tests/javascript/research_web*.test.mjs"
      - "requirements/web.in"
      - "requirements/web.lock"
      - "pyproject.toml"
      - ".github/workflows/research-web-checks.yml"
      - ".github/workflows/research-web-bootstrap.yml"
      - ".github/workflows/research-web-windows-verify.yml"
      - "tests/javascript/actions_quota_governance.test.mjs"
  push:
    branches:
      - master
    paths:
      - "app/research_web/**"
      - "app/cli/**"
      - "research_workbench_entrypoint/**"
      - "scripts/run_ci_pytest_partitions.py"
      - "scripts/stage_ci_pytest_evidence.py"
      - "tests/research_web/**"
      - "tests/unit/test_ci_pytest_partitions.py"
      - "tests/unit/test_ci_pytest_evidence_staging.py"
      - "tests/javascript/research_web*.test.mjs"
      - "requirements/web.in"
      - "requirements/web.lock"
      - "pyproject.toml"
      - ".github/workflows/research-web-checks.yml"
      - ".github/workflows/research-web-bootstrap.yml"
      - ".github/workflows/research-web-windows-verify.yml"
      - "tests/javascript/actions_quota_governance.test.mjs"

permissions:
  contents: read

concurrency:
  group: research-web-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Setup Node 24.19
        uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"

      - name: Install declared test dependencies
        run: |
          python -m venv .venv
          # Use the production Web closure, excluding root legacy runtime extras.
          .venv/bin/python - <<'PY_LOCK'
          import hashlib
          import json
          import logging
          import os
          import re
          import tomllib
          from pathlib import Path
          Path("logs").mkdir(exist_ok=True)
          logging.basicConfig(filename="logs/ci-pack-dependencies.log", level=logging.INFO)
          try:
              lock_bytes = Path("requirements/web.lock").read_bytes()
              projection = json.loads(Path("app/research_web/capabilities/pack-runtime-lock.json").read_bytes())
              if projection["schema"] != "research_pack_runtime_lock_v2" or hashlib.sha256(lock_bytes).hexdigest() != projection["lock_sha256"]:
                  raise ValueError("pack_runtime_lock_mismatch")
              versions = projection["versions"]
              if not isinstance(versions, dict) or not versions:
                  raise ValueError("pack_runtime_versions_missing")
              lines = lock_bytes.decode().splitlines()
              for package in (*versions, "reportlab", "openpyxl", "et-xmlfile"):
                  if not re.fullmatch(r"[a-z0-9]+(?:-[a-z0-9]+)*", package):
                      raise ValueError("pack_runtime_package_invalid")
                  starts = [i for i, line in enumerate(lines) if line.startswith(package + "==")]
                  if len(starts) != 1:
                      raise ValueError("pack_runtime_package_not_unique")
                  start = starts[0]
                  match = re.fullmatch(re.escape(package) + r"==([^\s;\\]+)\s*\\?", lines[start])
                  if match is None or (package in versions and match[1] != versions[package]):
                      raise ValueError("pack_runtime_version_mismatch")
                  block = [lines[start]]
                  for line in lines[start + 1:]:
                      if line and not line[0].isspace():
                          break
                      block.append(line)
                  if not any(re.fullmatch(r"\s+--hash=sha256:[0-9a-f]{64}\s*\\?", line) for line in block):
                      raise ValueError("pack_runtime_hash_missing")
              target = Path(os.environ["RUNNER_TEMP"])
              (target / "rwb-pack-dependencies.lock").write_bytes(lock_bytes)
              constraints = [line.rstrip().removesuffix("\\").rstrip() for line in lines if re.match(r"^[a-z0-9][a-z0-9-]*==", line)]
              (target / "rwb-pack-dependencies.constraints").write_text("\n".join(constraints) + "\n")
              project = tomllib.loads(Path("pyproject.toml").read_text())
              tools = project["project"]["optional-dependencies"]["dev"]
              if not isinstance(tools, list) or not tools or any(not isinstance(item, str) or not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_.-]*(?:\[[A-Za-z0-9_,.-]+\])?(?:[<>=!~][A-Za-z0-9.*+!,<>=~-]+)?", item) for item in tools):
                  raise ValueError("ci_test_tools_invalid")
              (target / "rwb-test-tools.in").write_text("\n".join(tools) + "\n")
              logging.info("ci_pack_dependencies_prepared count=%d", len(constraints))
          except (OSError, ValueError, KeyError, TypeError):
              logging.exception("ci_pack_dependencies_prepare_failed")
              raise
          PY_LOCK
          .venv/bin/python -m pip install --require-hashes --no-deps -r "$RUNNER_TEMP/rwb-pack-dependencies.lock"
          .venv/bin/python -m pip install -r "$RUNNER_TEMP/rwb-test-tools.in" -c "$RUNNER_TEMP/rwb-pack-dependencies.constraints"
          .venv/bin/python -m pip install --no-index --no-deps --no-build-isolation .
          .venv/bin/python - <<'PY_VERIFY'
          import json
          import logging
          from importlib.metadata import version
          from pathlib import Path
          logging.basicConfig(filename="logs/ci-pack-dependencies.log", level=logging.INFO)
          try:
              versions = json.loads(Path("app/research_web/capabilities/pack-runtime-lock.json").read_bytes())["versions"]
              for package, expected in versions.items():
                  if version(package) != expected:
                      raise ValueError("pack_runtime_installed_version_mismatch")
              logging.info("ci_pack_dependencies_verified count=%d", len(versions))
          except (OSError, ValueError, KeyError, TypeError, ImportError):
              logging.exception("ci_pack_dependencies_verify_failed")
              raise
          PY_VERIFY
          .venv/bin/python -I -B - <<'PY_ADMISSION'
          import json
          import logging
          import subprocess
          import sys
          from pathlib import Path
          from app.research_web.capabilities import pack_import_policy
          from app.research_web.capabilities.models import CapabilityError
          from app.research_web.capabilities.pack_dependencies import runtime_identity
          logging.basicConfig(filename="logs/ci-pack-dependencies.log", level=logging.INFO)
          try:
              runtime = runtime_identity()
              # The child loads only the frozen stdlib helper before its guard.
              code = """import importlib.util,json,sys
          from pathlib import Path
          value=json.load(sys.stdin)
          spec=importlib.util.spec_from_file_location('pack_import_policy',value['helper'])
          helper=importlib.util.module_from_spec(spec)
          sys.modules[spec.name]=helper
          spec.loader.exec_module(helper)
          runtime=value['runtime']
          helper.install_native(runtime['import_policy'],runtime['dependencies'],Path(value['helper']).parent)
          from jsonschema import FormatChecker
          FormatChecker().check('example.com','idn-hostname')
          print('ci_pack_native_admission_passed')
          """
              result = subprocess.run([sys.executable, "-I", "-B", "-c", code], input=json.dumps({"helper": pack_import_policy.__file__, "runtime": runtime}), text=True, capture_output=True, timeout=30, check=True)
              if result.stdout.strip() != "ci_pack_native_admission_passed":
                  raise ValueError("ci_pack_native_admission_missing")
              logging.info("ci_pack_host_native_admission_passed schema=%s", runtime["schema"])
          except subprocess.CalledProcessError as exc:
              logging.exception("ci_pack_host_native_admission_failed native_stderr=%s", exc.stderr)
              raise
          except (OSError, ValueError, ImportError, CapabilityError, subprocess.SubprocessError):
              logging.exception("ci_pack_host_native_admission_failed")
              raise
          PY_ADMISSION

      - name: Run Research Web Python contracts
        run: |
          PYTHONDONTWRITEBYTECODE=1 .venv/bin/python scripts/run_ci_pytest_partitions.py \
