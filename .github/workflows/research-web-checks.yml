          mcp_core = {"app/research_web/mcp_facade/backend.py", "app/research_web/datahub/providers_finance_mcp.py"}
          mcp_datahub = bool(mcp_core.intersection(files)) and all(name in mcp_paths or name.endswith(".md") and name.startswith(("docs/", ".ai/reports/")) for name in files)
