      - name: Verify pinned editorial engine without model or paid requests
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix services/ai_news/vendor/aihot
          node --test services/ai_news/tests/*.test.mjs

      - name: Stage safe pytest evidence
        id: stage-safe-evidence
        if: always()
        shell: bash
        run: |
