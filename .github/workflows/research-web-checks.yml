              --task-root "$RUNNER_TEMP/rwb-ci-pytest-research-web" \
              --allowed-parent "$RUNNER_TEMP" \
              --task-id "github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-research-web" \
              -- tests/research_web/test_research_pack_calculations.py \
                 tests/research_web/test_research_pack_contracts.py \
                 tests/research_web/test_pack_source_inputs.py \
                 tests/research_web/test_pack_execution_host.py \
                 tests/research_web/test_owned_method_execution.py \
                 tests/research_web/test_owned_method_compat.py \
                 tests/research_web/test_owned_method_dedup.py \
