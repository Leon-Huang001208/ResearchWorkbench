      - name: Run Research Web JavaScript contracts
        if: steps.contract-scope.outputs.retention_only != 'true'
        shell: bash
        run: |
          if [ "${{ steps.contract-scope.outputs.architecture_only }}" = "true" ]; then
            node --test tests/javascript/research_web_architecture.test.mjs
          elif [ "${{ steps.contract-scope.outputs.g2b_release_only }}" = "true" ]; then
            RWB_TEST_PYTHON="$PWD/.venv/bin/python" node --test tests/javascript/docker_runtime_contract.test.mjs tests/javascript/actions_quota_governance.test.mjs tests/javascript/research_web_architecture.test.mjs
          elif [ "${{ steps.contract-scope.outputs.reviewed_upgrade_only }}" = "true" ]; then
            RWB_TEST_PYTHON="$PWD/.venv/bin/python" node --test \
              tests/javascript/research_web_multiuser_session.test.mjs tests/javascript/research_web_mcp_login.test.mjs \
              tests/javascript/research_web_account_menu.test.mjs tests/javascript/research_web_account_workspace.test.mjs \
              tests/javascript/research_web_module_navigation.test.mjs tests/javascript/research_web_progress.test.mjs \
              tests/javascript/actions_quota_governance.test.mjs
          else
            RWB_TEST_PYTHON="$PWD/.venv/bin/python" node --test tests/javascript/research_web*.test.mjs tests/javascript/legacy_fingpt_cutover.test.mjs
          fi

      - name: Verify pinned editorial engine without model or paid requests
        if: steps.contract-scope.outputs.retention_only != 'true' && steps.contract-scope.outputs.architecture_only != 'true' && steps.contract-scope.outputs.g2b_release_only != 'true' && steps.contract-scope.outputs.reviewed_upgrade_only != 'true'
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix services/ai_news/vendor/aihot
          node --test services/ai_news/tests/*.test.mjs

      - name: Stage safe pytest evidence
        id: stage-safe-evidence
        if: always() && steps.contract-scope.outputs.architecture_only != 'true'
        shell: bash
        run: |
          .venv/bin/python scripts/stage_ci_pytest_evidence.py \
            --runner-temp "$RUNNER_TEMP" \
            --workspace "$GITHUB_WORKSPACE" \
            --max-bytes 104857600

      - name: Upload safe pytest evidence
        if: always() && steps.contract-scope.outputs.architecture_only != 'true' && steps.stage-safe-evidence.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: research-web-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/research-web-checks
          if-no-files-found: ignore
          retention-days: 3
