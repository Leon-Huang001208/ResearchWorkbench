      - "app/research_web/**"
      - "app/cli/**"
      - "research_workbench_entrypoint/**"
      - "scripts/run_ci_pytest_partitions.py"
      - "scripts/stage_ci_pytest_evidence.py"
      - "scripts/test_artifact_retention.py"
      - "tests/research_web/**"
      - "tests/unit/test_ci_pytest_partitions.py"
      - "tests/unit/test_ci_pytest_evidence_staging.py"
      - "tests/javascript/research_web*.test.mjs"
      - "requirements/web.in"
      - "requirements/web.lock"
      - "pyproject.toml"
      - ".github/workflows/research-web-checks.yml"
      - ".github/workflows/research-web-bootstrap.yml"
      - ".github/workflows/research-web-windows-verify.yml"
      - "tests/javascript/actions_quota_governance.test.mjs"

permissions:
  contents: read

concurrency:
  group: research-web-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Setup Node 24.19
        uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"

      - name: Choose contract test scope
        id: contract-scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          base, head = os.environ.get("BASE_SHA", ""), os.environ.get("HEAD_SHA", "")
          files = []
          if base and head and base != "0" * 40:
              fetched = subprocess.run(["git", "-c", "gc.auto=0", "fetch", "--no-tags", "--no-write-fetch-head", "--no-auto-maintenance", "--depth=1", "origin", base, head], capture_output=True)
              if fetched.returncode == 0:
                  diff = subprocess.run(["git", "diff", "--name-only", "-z", base, head], capture_output=True)
                  if diff.returncode == 0:
                      files = [name for name in diff.stdout.decode().split("\0") if name]
          tool = {"scripts/test_artifact_retention.py", "tests/research_web/test_test_artifact_retention.py"}
          scope_files = tool | {".github/workflows/research-web-checks.yml", "tests/javascript/actions_quota_governance.test.mjs", "AGENTS.md"}
          limited = bool(tool.intersection(files)) and all(name in scope_files or name.endswith(".md") and name.startswith(("docs/", ".ai/reports/")) for name in files)
          architecture = {"scripts/check_research_architecture.mjs", "tests/javascript/research_web_architecture.test.mjs"}
          architecture_files = architecture | {".github/workflows/research-web-checks.yml", "tests/javascript/actions_quota_governance.test.mjs"}
          architecture_only = bool(architecture.intersection(files)) and all(name in architecture_files or name.endswith(".md") and name.startswith(("docs/", ".ai/reports/")) for name in files)
          release_core = {"docker/release.py", "docker/Dockerfile.release", "docker/release-schema.json", "app/research_web/maintenance.py"}
          release_paths = release_core | {
              "docker/manage.py", "rwb-docker", "app/research_web/automation/service.py", "app/research_web/client.py", "app/research_web/main.py", "app/research_web/report_studio.py", "app/research_web/report_workflows/runtime.py", "app/research_web/service.py",
              "tests/research_web/test_docker_release.py", "tests/research_web/test_release_maintenance.py", "tests/research_web/test_docker_manager.py", "tests/research_web/test_docker_packaging.py", "tests/research_web/test_report_studio.py", "tests/research_web/test_api.py", "tests/fixtures/g2b_fault_controller.py",
              ".github/workflows/research-web-checks.yml", "tests/javascript/actions_quota_governance.test.mjs", "scripts/check_research_architecture.mjs", "tests/javascript/research_web_architecture.test.mjs", "README.md", ".ai/reports/2026-10-14-g2b-task.json",
              "docs/architecture/research-web/architecture-map.json", "docs/architecture/research-web/readme-review.json", "outputs/research-web-architecture/api-atlas.html", "outputs/research-web-architecture/index.html",
          }
          release = bool(release_core.intersection(files)) and all(name in release_paths or name.endswith(".md") and name.startswith(("docs/", ".ai/reports/")) for name in files)
          upgrade_core = {"research_workbench_entrypoint/resident/model_provider_upgrade.py", "research_workbench_entrypoint/resident/gateway_upgrade.py"}
          upgrade_paths = upgrade_core | {
              "tests/research_web/test_model_provider_upgrade.py", "tests/research_web/test_gateway_upgrade.py",
              "app/research_web/ui/server/session.mjs", "app/research_web/ui/server/profile.css", "app/research_web/ui/progress-data.json",
              "tests/javascript/research_web_multiuser_session.test.mjs", "tests/javascript/research_web_mcp_login.test.mjs",
              "docs/architecture/research-web/readme-review.json", ".github/workflows/research-web-checks.yml", ".github/workflows/research-web-bootstrap.yml", "tests/javascript/actions_quota_governance.test.mjs",
          }
          reviewed_upgrade = bool(upgrade_core.intersection(files)) and all(name in upgrade_paths or name.endswith(".md") and name.startswith(("docs/", ".ai/reports/")) for name in files)
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write("retention_only=" + str(limited).lower() + "\n")
              output.write("architecture_only=" + str(architecture_only).lower() + "\n")
              output.write("g2b_release_only=" + str(release).lower() + "\n")
              output.write("reviewed_upgrade_only=" + str(reviewed_upgrade).lower() + "\n")
          print("Contract scope: " + ("retention tool" if limited else "architecture checker" if architecture_only else "G2B release and Host admission" if release else "reviewed maintenance upgrade" if reviewed_upgrade else "full Research Web"))
          PY

      - name: Install declared test dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e ".[dev]"
          # Renderer/workbook and MCP SDK packages are already locked Web dependencies.
          .venv/bin/python - <<'PY'
          import os
          from pathlib import Path
          lines = Path("requirements/web.lock").read_text().splitlines()
          block = []
          for package in ("reportlab", "openpyxl", "et-xmlfile", "mcp", "mcp-types"):
              start = next(i for i, line in enumerate(lines) if line.startswith(package + "=="))
              block.append(lines[start])
              for line in lines[start + 1:]:
                  if line and not line[0].isspace():
                      break
                  block.append(line)
          target = Path(os.environ["RUNNER_TEMP"]) / "rwb-reportlab.lock"
          target.write_text("\n".join(block) + "\n")
          PY
          .venv/bin/python -m pip install --require-hashes --no-deps -r "$RUNNER_TEMP/rwb-reportlab.lock"
          .venv/bin/python -c "import importlib.metadata as m; assert m.version('mcp') == '2.2.0' and m.version('mcp-types') == '2.2.0'"

      - name: Run Research Web Python contracts
        run: |
          if [ "${{ steps.contract-scope.outputs.architecture_only }}" = "true" ]; then
            echo "Architecture checker scope: no Python product changes"
            exit 0
          fi
          if [ "${{ steps.contract-scope.outputs.retention_only }}" = "true" ]; then
            PYTHONDONTWRITEBYTECODE=1 .venv/bin/python scripts/run_ci_pytest_partitions.py \
              --task-root "$RUNNER_TEMP/rwb-ci-pytest-research-web" \
              --allowed-parent "$RUNNER_TEMP" \
              --task-id "github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-research-web" \
              -- tests/research_web/test_test_artifact_retention.py --confcutdir=tests/research_web -q
            exit 0
          fi
          if [ "${{ steps.contract-scope.outputs.g2b_release_only }}" = "true" ]; then
            PYTHONDONTWRITEBYTECODE=1 .venv/bin/python scripts/run_ci_pytest_partitions.py \
              --task-root "$RUNNER_TEMP/rwb-ci-pytest-research-web" \
              --allowed-parent "$RUNNER_TEMP" \
              --task-id "github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-research-web" \
              -- \
              tests/research_web/test_docker_release.py \
              tests/research_web/test_release_maintenance.py \
              tests/research_web/test_docker_manager.py \
              tests/research_web/test_docker_packaging.py \
              tests/research_web/test_protocol.py \
              tests/research_web/test_api.py::test_release_maintenance_blocks_web_automation_and_report_entries \
              tests/research_web/test_api.py::test_release_idle_refuses_any_unverified_hot_state \
              tests/research_web/test_api.py::test_release_idle_refuses_alias_hot_state \
              tests/research_web/test_api.py::test_release_idle_includes_native_children_and_report_workers \
              tests/research_web/test_api.py::test_release_idle_includes_current_datahub_and_plugin_work \
              tests/research_web/test_api.py::test_create_submit_duplicate_never_replays \
              tests/research_web/test_api.py::test_unknown_admission_not_retried \
              tests/research_web/test_api.py::test_cross_origin_and_invalid_credentials_do_not_leak_input \
              tests/research_web/test_api.py::test_no_dsh_connection_no_fake_success \
              tests/research_web/test_api.py::test_unowned_instance_is_read_only \
              tests/research_web/test_api.py::test_model_backend_failure_preserves_runtime_health_and_unknown_credential \
              tests/research_web/test_weknora_current_api.py::test_service_only_start_arms_existing_scheduler_without_automation_history \
              tests/research_web/test_automation_research_task.py::test_queued_run_uses_prior_definition_when_task_changes \
              tests/research_web/test_automation_research_task.py::test_native_research_run_uses_independent_session_without_fake_skill \
              tests/research_web/test_report_workflow_integration.py::test_refresh_success_delegates_once_to_claw_and_locks_version \
              tests/research_web/test_report_workflow_integration.py::test_delivery_retry_consumes_late_payload_without_starting_another_claw_session \
              tests/research_web/test_report_workflow_integration.py::test_schedule_is_shanghai_non_reentrant_and_catches_up_once \
              tests/research_web/test_report_studio.py::test_version_is_immutable_and_active_run_locks_version \
              tests/research_web/test_report_studio.py::test_weekly_schedule_and_overlap_are_persistent \
              --confcutdir=tests/research_web -q
            exit 0
          fi
          if [ "${{ steps.contract-scope.outputs.reviewed_upgrade_only }}" = "true" ]; then
            # Preserve the original maintenance fixtures' historical source objects.
            git -c gc.auto=0 -c maintenance.auto=false fetch --no-tags --no-write-fetch-head --no-auto-maintenance --depth=1 origin \
              b800e50366d1a0868372bbf173822976066c143f \
              db2ae9a48ceca365852072e622aa6627aa7d0b83 \
              1529c3189b008b9861a2bee1511f051feefa76eb
            PYTEST_PLUGINS=tests.research_web.event_test_support PYTHONDONTWRITEBYTECODE=1 .venv/bin/python scripts/run_ci_pytest_partitions.py \
              --task-root "$RUNNER_TEMP/rwb-ci-pytest-research-web" \
              --allowed-parent "$RUNNER_TEMP" \
              --task-id "github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-research-web" \
              -- tests/research_web/test_model_provider_upgrade.py tests/research_web/test_gateway_upgrade.py --confcutdir=tests/research_web -q
            exit 0
          fi
          # The exact-handoff fixture verifies these historical objects offline.
          # Keep checkout shallow and fetch only the three fixed source commits.
          git -c gc.auto=0 -c maintenance.auto=false fetch --no-tags --no-write-fetch-head --no-auto-maintenance --depth=1 origin \
            b800e50366d1a0868372bbf173822976066c143f \
            db2ae9a48ceca365852072e622aa6627aa7d0b83 \
            1529c3189b008b9861a2bee1511f051feefa76eb
          PYTEST_PLUGINS=tests.research_web.event_test_support PYTHONDONTWRITEBYTECODE=1 .venv/bin/python scripts/run_ci_pytest_partitions.py \
            --task-root "$RUNNER_TEMP/rwb-ci-pytest-research-web" \
