name: Research Web Checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/research_web/**"
      - "app/cli/**"
      - "research_workbench_entrypoint/**"
      - "tests/research_web/**"
      - "tests/javascript/research_web*.test.mjs"
      - "requirements/web.in"
      - "requirements/web.lock"
      - "pyproject.toml"
      - ".github/workflows/research-web-checks.yml"
      - ".github/workflows/research-web-bootstrap.yml"
      - ".github/workflows/research-web-windows-verify.yml"
      - "tests/javascript/actions_quota_governance.test.mjs"
  push:
    branches:
      - master
    paths:
      - "app/research_web/**"
      - "app/cli/**"
      - "research_workbench_entrypoint/**"
      - "tests/research_web/**"
      - "tests/javascript/research_web*.test.mjs"
      - "requirements/web.in"
      - "requirements/web.lock"
      - "pyproject.toml"
      - ".github/workflows/research-web-checks.yml"
      - ".github/workflows/research-web-bootstrap.yml"
      - ".github/workflows/research-web-windows-verify.yml"
      - "tests/javascript/actions_quota_governance.test.mjs"

permissions:
  contents: read

concurrency:
  group: research-web-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Setup Node 24.19
        uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"

      - name: Install declared test dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e ".[dev]"
          # The renderer is already a locked Web product dependency, not a new extra.
          .venv/bin/python - <<'PY'
          import os
          from pathlib import Path
          lines = Path("requirements/web.lock").read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if line.startswith("reportlab=="))
          block = [lines[start]]
          for line in lines[start + 1:]:
              if line and not line[0].isspace():
                  break
              block.append(line)
          target = Path(os.environ["RUNNER_TEMP"]) / "rwb-reportlab.lock"
          target.write_text("\n".join(block) + "\n")
          PY
          .venv/bin/python -m pip install --require-hashes --no-deps -r "$RUNNER_TEMP/rwb-reportlab.lock"

      - name: Run Research Web Python contracts
        run: |
          .venv/bin/python -m pytest \
            tests/research_web/test_protocol.py \
            tests/research_web/test_model_profiles.py \
            tests/research_web/test_fingpt_dsh_fusion.py \
            tests/research_web/test_fingpt_comparison.py \
            tests/research_web/test_research_quality.py \
            tests/research_web/test_research_arithmetic.py \
            tests/research_web/test_report_delivery_links.py \
            tests/research_web/test_fingpt_evidence_contract.py \
            tests/research_web/test_research_calculations.py \
            tests/research_web/test_research_business_evidence.py \
            tests/research_web/test_research_quality_scope.py \
            tests/research_web/test_delivery_cache.py \
            tests/research_web/test_research_report.py \
            tests/research_web/test_report_revision.py \
            tests/research_web/test_report_calculations.py \
            tests/research_web/test_report_formats.py \
            tests/research_web/test_report_system_flow.py \
            tests/research_web/test_bound_analysis.py \
            tests/research_web/test_research_source_reading.py \
            tests/research_web/test_research_report_binding.py \
            tests/research_web/test_session_search.py \
            tests/research_web/test_integration_coordinator.py \
            tests/research_web/test_documentation.py \
            tests/research_web/test_doc_sync.py \
            tests/research_web/test_cli_lazy.py \
            tests/research_web/test_ai_news_host.py \
            tests/research_web/test_ai_news_multiuser.py \
            tests/research_web/test_ai_news_eval.py \
            tests/research_web/test_aihot.py \
            tests/research_web/test_resident.py \
            tests/research_web/test_gateway_upgrade.py tests/research_web/test_model_provider_upgrade.py \
            tests/research_web/test_multiuser_accounts.py \
            tests/research_web/test_multiuser_gateway.py \
            tests/research_web/test_multiuser_runtime.py \
            tests/research_web/test_multiuser_resident.py \
            tests/research_web/test_multiuser_cli.py \
            --confcutdir=tests/research_web -q

      - name: Run Research Web JavaScript contracts
        shell: bash
        run: RWB_TEST_PYTHON="$PWD/.venv/bin/python" node --test tests/javascript/research_web*.test.mjs

      - name: Verify pinned editorial engine without model or paid requests
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix services/ai_news/vendor/aihot
          node --test services/ai_news/tests/*.test.mjs
