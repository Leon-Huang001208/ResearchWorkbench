name: Research Web Checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/research_web/**"
      - "app/cli/**"
      - "research_workbench_entrypoint/**"
      - "tests/research_web/**"
      - "tests/javascript/research_web*.test.mjs"
      - "requirements/web.in"
      - "requirements/web.lock"
      - "pyproject.toml"
      - ".github/workflows/research-web-checks.yml"
      - ".github/workflows/research-web-bootstrap.yml"
      - ".github/workflows/research-web-windows-verify.yml"
      - "tests/javascript/actions_quota_governance.test.mjs"
  push:
    branches:
      - master
    paths:
      - "app/research_web/**"
      - "app/cli/**"
      - "research_workbench_entrypoint/**"
      - "tests/research_web/**"
      - "tests/javascript/research_web*.test.mjs"
      - "requirements/web.in"
      - "requirements/web.lock"
      - "pyproject.toml"
      - ".github/workflows/research-web-checks.yml"
      - ".github/workflows/research-web-bootstrap.yml"
      - ".github/workflows/research-web-windows-verify.yml"
      - "tests/javascript/actions_quota_governance.test.mjs"

permissions:
  contents: read

concurrency:
  group: research-web-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Setup Node 24.19
        uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"

      - name: Install declared test dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e ".[dev]"
          # These renderer/workbook packages are already locked Web dependencies.
          .venv/bin/python - <<'PY'
          import os
          from pathlib import Path
          lines = Path("requirements/web.lock").read_text().splitlines()
          block = []
          for package in ("reportlab", "openpyxl", "et-xmlfile"):
              start = next(i for i, line in enumerate(lines) if line.startswith(package + "=="))
              block.append(lines[start])
              for line in lines[start + 1:]:
                  if line and not line[0].isspace():
                      break
                  block.append(line)
          target = Path(os.environ["RUNNER_TEMP"]) / "rwb-reportlab.lock"
          target.write_text("\n".join(block) + "\n")
          PY
          .venv/bin/python -m pip install --require-hashes --no-deps -r "$RUNNER_TEMP/rwb-reportlab.lock"

      - name: Run Research Web Python contracts
        run: |
          .venv/bin/python -m pytest \
            tests/research_web/test_protocol.py \
            tests/research_web/test_discovery.py \
