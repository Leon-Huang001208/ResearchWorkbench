name: Desktop Verify

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src-tauri/**"
      - "desktop/**"
      - "scripts/desktop/**"
      - "core/settings/**"
      - "services/desktop_platform/**"
      - "services/wind_*/**"
      - "services/wind_*.py"
      - "data_layer/adapters/wind/**"
      - "app/api/main.py"
      - "app/api/routes/setup.py"
      - "app/api/configuration_models.py"
      - "app/web/**"
      - "app/api/routes/wind.py"
      - "app/api/routes/report_projects.py"
      - "services/database_readiness.py"
      - "workers/watchdog.py"
      - "docs/desktop_packaging.md"
      - "pyproject.toml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/desktop-verify.yml"
      - ".github/workflows/desktop-release.yml"
  push:
    branches:
      - master
    paths:
      - "src-tauri/**"
      - "desktop/**"
      - "scripts/desktop/**"
      - "core/settings/**"
      - "services/desktop_platform/**"
      - "services/wind_*/**"
      - "services/wind_*.py"
      - "data_layer/adapters/wind/**"
      - "app/api/main.py"
      - "app/api/routes/setup.py"
      - "app/api/configuration_models.py"
      - "app/web/**"
      - "app/api/routes/wind.py"
      - "app/api/routes/report_projects.py"
      - "services/database_readiness.py"
      - "workers/watchdog.py"
      - "docs/desktop_packaging.md"
      - "pyproject.toml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/desktop-verify.yml"
      - ".github/workflows/desktop-release.yml"

jobs:
  verify:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            os: macos-14
            triple: aarch64-apple-darwin
            executable_suffix: ""
            postgres_port: 55432
          - label: Windows x64
            os: windows-2022
            triple: x86_64-pc-windows-msvc
            executable_suffix: ".exe"
            postgres_port: 55432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: python -m pip install -e '.[dev]' pyinstaller "setuptools<81"

      - name: Run desktop contract tests
        run: python -m pytest tests/unit/test_desktop_shell_scaffold.py tests/unit/test_check_sidecar_health.py -q

      - name: Build backend sidecar
        run: python scripts/desktop/build_sidecar.py

      - name: Verify macOS sidecar
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          sidecar="build/desktop-sidecar/dist/research-workbench-backend-${{ matrix.triple }}${{ matrix.executable_suffix }}"
          if [[ ! -f "$sidecar" ]]; then
            echo "Expected sidecar was not produced: $sidecar" >&2
            exit 1
          fi

      - name: Verify Windows sidecar
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sidecar = "build/desktop-sidecar/dist/research-workbench-backend-${{ matrix.triple }}${{ matrix.executable_suffix }}"
          if (-not (Test-Path -LiteralPath $sidecar -PathType Leaf)) {
            throw "Expected sidecar was not produced: $sidecar"
          }

      - name: Start pgvector on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew install postgresql@17 pgvector
          PG_BIN="$(brew --prefix postgresql@17)/bin"
          PGDATA="$RUNNER_TEMP/research-workbench-pgdata"
          rm -rf "$PGDATA"
          "$PG_BIN/initdb" --pgdata "$PGDATA" --username postgres --auth trust
          "$PG_BIN/pg_ctl" -D "$PGDATA" -o "-p 55432 -h 127.0.0.1" -w start
          "$PG_BIN/createdb" --host 127.0.0.1 --port 55432 --username postgres research_workbench
          "$PG_BIN/psql" --host 127.0.0.1 --port 55432 --username postgres --dbname research_workbench \
            --command "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Start pgvector on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $postgresHome = 'C:\Program Files\PostgreSQL\16'
          $pgBin = Join-Path $postgresHome 'bin'
          $pgVectorSource = Join-Path $env:RUNNER_TEMP 'pgvector'
          $serviceName = 'postgresql-x64-16'
          $env:PGPASSWORD = 'postgres'
          $chocoParameters = "/Password:postgres /Port:${{ matrix.postgres_port }}"

          choco install postgresql16 --params $chocoParameters --yes --no-progress --execution-timeout 1200
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to install the helper-owned PostgreSQL 16 service'
          }
          if (-not (Test-Path -LiteralPath $pgBin -PathType Container)) {
            throw "PostgreSQL installation directory was not found: $pgBin"
          }
          $service = Get-Service -Name $serviceName -ErrorAction Stop
          if ($service.Status -ne 'Running') {
            Start-Service -Name $serviceName -ErrorAction Stop
          }

          $ready = $false
          for ($attempt = 1; $attempt -le 30; $attempt++) {
            & (Join-Path $pgBin 'pg_isready.exe') --host 127.0.0.1 --port ${{ matrix.postgres_port }} --username postgres --dbname postgres | Out-Null
            if ($LASTEXITCODE -eq 0) {
              $ready = $true
              break
            }
            Start-Sleep -Seconds 2
          }
          if (-not $ready) {
            throw 'Helper-owned PostgreSQL did not become ready'
          }

          $databaseExists = & (Join-Path $pgBin 'psql.exe') --host 127.0.0.1 --port ${{ matrix.postgres_port }} --username postgres --dbname postgres --tuples-only --command "SELECT 1 FROM pg_database WHERE datname = 'research_workbench';"
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to query helper-owned PostgreSQL databases'
          }
          if (-not ($databaseExists -match '1')) {
            & (Join-Path $pgBin 'createdb.exe') --host 127.0.0.1 --port ${{ matrix.postgres_port }} --username postgres research_workbench
            if ($LASTEXITCODE -ne 0) {
              throw 'Unable to create the helper-owned research_workbench database'
            }
          }

          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vcvars = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Auxiliary\Build\vcvars64.bat'
          if ($LASTEXITCODE -ne 0 -or -not $vcvars) {
            throw 'Visual Studio x64 C++ build tools were not found for pgvector'
          }
          git clone --depth 1 --branch v0.8.5 https://github.com/pgvector/pgvector.git $pgVectorSource
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to fetch the pinned pgvector source'
          }
          $buildCommand = "call `"$vcvars`" && set `"PGROOT=$postgresHome`" && cd /d `"$pgVectorSource`" && nmake /F Makefile.win && nmake /F Makefile.win install"
          cmd.exe /d /s /c $buildCommand
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to build and install the native pgvector extension'
          }
          & (Join-Path $pgBin 'psql.exe') --host 127.0.0.1 --port ${{ matrix.postgres_port }} --username postgres --dbname research_workbench --command 'CREATE EXTENSION IF NOT EXISTS vector;'
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to enable the pgvector extension'
          }

      - name: Smoke test macOS sidecar /health
        if: runner.os == 'macOS'
        shell: bash
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:${{ matrix.postgres_port }}/research_workbench
          RESEARCH_DESKTOP: "1"
          RESEARCH_RUN_MODE: desktop
          RESEARCH_PROJECT_ROOT: ${{ github.workspace }}
          RESEARCH_DESKTOP_DATA_DIR: ${{ runner.temp }}/research-workbench-desktop-verify
        run: |
          set -euo pipefail
          sidecar="build/desktop-sidecar/dist/research-workbench-backend-${{ matrix.triple }}${{ matrix.executable_suffix }}"
          python scripts/desktop/check_sidecar_health.py \
            --executable "$sidecar" \
            --port 8765 \
            --timeout-seconds 60

      - name: Smoke test Windows sidecar /health
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:${{ matrix.postgres_port }}/research_workbench
          RESEARCH_DESKTOP: "1"
          RESEARCH_RUN_MODE: desktop
          RESEARCH_PROJECT_ROOT: ${{ github.workspace }}
          RESEARCH_DESKTOP_DATA_DIR: ${{ runner.temp }}/research-workbench-desktop-verify
        run: |
          $ErrorActionPreference = 'Stop'
          $sidecar = "build/desktop-sidecar/dist/research-workbench-backend-${{ matrix.triple }}${{ matrix.executable_suffix }}"
          python scripts/desktop/check_sidecar_health.py `
            --executable $sidecar `
            --port 8765 `
            --timeout-seconds 60

      - name: Smoke test setup-required sidecar /health on macOS
        if: runner.os == 'macOS'
        shell: bash
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:1/research_workbench
          RESEARCH_DESKTOP: "1"
          RESEARCH_RUN_MODE: desktop
          RESEARCH_PROJECT_ROOT: ${{ github.workspace }}
          RESEARCH_DESKTOP_DATA_DIR: ${{ runner.temp }}/research-workbench-desktop-setup-smoke
        run: |
          set -euo pipefail
          sidecar="build/desktop-sidecar/dist/research-workbench-backend-${{ matrix.triple }}${{ matrix.executable_suffix }}"
          python scripts/desktop/check_sidecar_health.py \
            --executable "$sidecar" \
            --port 8766 \
            --timeout-seconds 60 \
            --expected-persistence-status setup_required \
            --log-file build/desktop-sidecar/setup-smoke.log

      - name: Smoke test setup-required sidecar /health on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:1/research_workbench
          RESEARCH_DESKTOP: "1"
          RESEARCH_RUN_MODE: desktop
          RESEARCH_PROJECT_ROOT: ${{ github.workspace }}
          RESEARCH_DESKTOP_DATA_DIR: ${{ runner.temp }}/research-workbench-desktop-setup-smoke
        run: |
          $ErrorActionPreference = 'Stop'
          $sidecar = "build/desktop-sidecar/dist/research-workbench-backend-${{ matrix.triple }}${{ matrix.executable_suffix }}"
          python scripts/desktop/check_sidecar_health.py `
            --executable $sidecar `
            --port 8766 `
            --timeout-seconds 60 `
            --expected-persistence-status setup_required `
            --log-file build/desktop-sidecar/setup-smoke.log

      - name: Stop helper-owned PostgreSQL on macOS
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          if ! brew list --versions postgresql@17 >/dev/null 2>&1; then
            exit 0
          fi
          PG_BIN="$(brew --prefix postgresql@17)/bin"
          PGDATA="$RUNNER_TEMP/research-workbench-pgdata"
          if [[ -x "$PG_BIN/pg_ctl" && -d "$PGDATA" ]]; then
            "$PG_BIN/pg_ctl" -D "$PGDATA" -m fast -w stop || true
          fi

      - name: Stop helper-owned pgvector on Windows
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $service = Get-Service -Name 'postgresql-x64-16' -ErrorAction SilentlyContinue
          if ($null -eq $service) {
            Write-Host 'No helper-owned PostgreSQL service needed cleanup.'
            exit 0
          }
          if ($service.Status -eq 'Running') {
            Stop-Service -Name $service.Name -ErrorAction Stop
          }
          Write-Host "Stopped helper-owned PostgreSQL service: $($service.Name)"
          exit 0

      - name: Copy backend sidecar into Tauri
        run: python scripts/desktop/prepare_tauri_sidecar.py

      - name: Build Tauri bundles
        run: npm run desktop:build

      - name: Upload desktop bundles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-workbench-desktop-${{ matrix.triple }}
          path: |
            src-tauri/target/release/bundle/**
            build/desktop-sidecar/health-smoke.log
            build/desktop-sidecar/setup-smoke.log
          if-no-files-found: warn
          retention-days: 14
