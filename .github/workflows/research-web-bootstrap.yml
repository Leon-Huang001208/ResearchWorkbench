name: Research Web Bootstrap

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-web-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-install:
    name: Clean Web install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2022
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node 22.19
        uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"

      - name: Install Web stack on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: ./setup-web.sh --no-start

      - name: Install Web stack on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: setup-web.cmd --no-start

      - name: Probe Windows runtime module fallback
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          @'
          import shutil
          from pathlib import Path

          from app.research_web import launch_runtime

          source = (
              Path.home()
              / ".research-workbench"
              / "runtime"
              / "dsh"
              / launch_runtime.PINNED_COMMIT
          )
          home = (
              Path.home()
              / ".research-workbench"
              / "research-web"
              / "runtime"
              / "home"
          )
          data = Path.home() / ".research-workbench" / "research-web"
          try:
              node = shutil.which("node")
              if node is None:
                  raise RuntimeError("node_missing")
              count = launch_runtime.prepare_runtime_module_fallback(source, home, node)
          except RuntimeError as exc:
              cause = exc.__cause__
              print(f"fallback_cause={type(cause).__name__}")
              print(f"fallback_returncode={getattr(cause, 'returncode', None)}")
              print(f"fallback_stdout={getattr(cause, 'stdout', '')}")
              print(f"fallback_stderr={getattr(cause, 'stderr', '')}")
              raise
          print(f"fallback_module_count={count}")
          manifest = launch_runtime.stage_tabbit_package(launch_runtime.TABBIT_VENDOR, home)
          print(f"tabbit_package_version={manifest['version']}")
          adapter = launch_runtime.stage_tabbit_adapter(
              Path(launch_runtime.__file__).parent / "runtime" / "tabbit-adapter.mjs",
              home,
          )
          print(f"tabbit_adapter_ready={adapter.name}")
          control = data / ".control" / "tabbit-applied.json"
          launch_runtime._atomic_json(control, launch_runtime.load_tabbit_config(data))
          print(f"tabbit_control_ready={control.name}")
          '@ | .\.venv\Scripts\python.exe -

      - name: Verify macOS environment and start services
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          test -x .venv/bin/python
          .venv/bin/python -c "import importlib.metadata as m, cjpy, requests, urllib3; assert m.version('cjpy') == '0.5.2'"
          ./rwb web start --no-open
          ./rwb web doctor --json > doctor.json
          .venv/bin/python -c "import json; report=json.load(open('doctor.json', encoding='utf-8')); assert report['ok'], report"
          curl --fail --silent http://127.0.0.1:8088/api/research/data/connections > connections.json
          .venv/bin/python -c "import json; data=json.load(open('connections.json', encoding='utf-8')); item=next(x for x in data['sources'] if x['id']=='tinysoft'); assert item['configured'] is False and item['callable'] is False and item['restart_required'] is False, item"

      - name: Verify Windows environment and start services
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path -LiteralPath '.venv\Scripts\python.exe' -PathType Leaf)) {
            throw 'Project-owned Python environment was not created'
          }
          & .\.venv\Scripts\python.exe -c "import importlib.metadata as m, cjpy, requests, urllib3; assert m.version('cjpy') == '0.5.2'"
          if ($LASTEXITCODE -ne 0) { throw 'CJPY dependency verification failed' }
          & .\rwb.cmd web start --no-open
          if ($LASTEXITCODE -ne 0) { throw 'Web services failed to start' }
          & .\rwb.cmd web doctor --json | Out-File -LiteralPath doctor.json -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Web Doctor failed' }
          $doctor = Get-Content -LiteralPath doctor.json -Raw -Encoding utf8 | ConvertFrom-Json
          if (-not $doctor.ok) { throw "Web Doctor reported issues: $($doctor.issues -join ', ')" }
          $connections = Invoke-RestMethod -Uri 'http://127.0.0.1:8088/api/research/data/connections' -TimeoutSec 10
          $tinysoft = $connections.sources | Where-Object { $_.id -eq 'tinysoft' } | Select-Object -First 1
          if ($null -eq $tinysoft -or $tinysoft.configured -or $tinysoft.callable -or $tinysoft.restart_required) {
            throw 'Tinysoft must remain installed-but-unconfigured without CI credentials'
          }

      - name: Print safe Windows runtime diagnostics
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $logRoot = Join-Path $env:USERPROFILE '.research-workbench\logs'
          if (-not (Test-Path -LiteralPath $logRoot -PathType Container)) {
            Write-Output 'runtime_log_directory_missing'
            exit 0
          }
          Get-ChildItem -LiteralPath $logRoot -File -Filter '*.log' | ForEach-Object {
            Write-Output "runtime_log=$($_.Name)"
            Get-Content -LiteralPath $_.FullName -Tail 240
          }

      - name: Stop macOS services
        if: always() && runner.os == 'macOS'
        shell: bash
        run: ./rwb web stop || true

      - name: Stop Windows services
        if: always() && runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: if (Test-Path -LiteralPath '.venv\Scripts\python.exe') { & .\rwb.cmd web stop }

      - name: Upload safe bootstrap evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-web-bootstrap-${{ matrix.os }}-${{ github.run_id }}
          path: |
            doctor.json
            connections.json
            logs/setup-web.log
          if-no-files-found: ignore
          retention-days: 14
